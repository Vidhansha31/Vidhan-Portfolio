<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">

<title>Vidhan Sharma — Product and customer success, B2B SaaS</title>
<meta name="description" content="Product Associate at HotWax Commerce. Enterprise order management, supply chain execution, NetSuite integration and client delivery for retail brands.">
<meta property="og:title" content="Vidhan Sharma — Product and customer success, B2B SaaS">
<meta property="og:description" content="Order management, supply chain execution and NetSuite integration for enterprise retail brands.">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="content.js"></script>
<script>
(function(){
  try{
    var S=window.SITE; if(!S) return;
    if(S.fonts&&S.fonts.googleFonts){
      var l=document.createElement('link'); l.rel='stylesheet';
      l.href='https://fonts.googleapis.com/css2?family='+S.fonts.googleFonts+'&display=swap';
      document.head.appendChild(l);
    }
    var t=S.theme||{}, r=document.documentElement;
    var map={paper:'--paper',card:'--card',ink:'--ink',inkSoft:'--ink-soft',rule:'--rule',
             accent:'--accent',accentSoft:'--accent-soft',accentDeep:'--accent-deep',
             warm:'--warm',warmSoft:'--warm-soft',sand:'--sand',sandSoft:'--sand-soft',
             radius:'--radius',maxWidth:'--maxw'};
    for(var k in map){ if(t[k]) r.style.setProperty(map[k],t[k]); }
    if(S.fonts){
      if(S.fonts.display) r.style.setProperty('--display',S.fonts.display);
      if(S.fonts.body)    r.style.setProperty('--body',S.fonts.body);
    }
    if(S.meta){
      if(S.meta.tabTitle) document.title=S.meta.tabTitle;
      if(S.meta.favicon){ var f=document.createElement('link'); f.rel='icon'; f.href=S.meta.favicon; document.head.appendChild(f); }
    }
  }catch(e){}
})();
</script>

<style>
/* ============================================================ TOKENS */
:root{
  --paper:#F9FAF5; --card:#FFFFFD; --ink:#252B26; --ink-soft:#6B7268;
  --rule:#E2E6DD; --accent:#4A7C56; --accent-soft:#EBF2EB; --accent-deep:#2F5639;
  --warm:#C87A68; --warm-soft:#F7E9E5; --sand:#C9A227; --sand-soft:#F6EFD8;
  --radius:10px; --maxw:1080px;
  --display:'Source Serif 4',Georgia,serif;
  --body:'Public Sans',system-ui,sans-serif;
  --gut:clamp(20px,5vw,48px);
  --sec:clamp(44px,5vw,68px);        /* one vertical rhythm for every section */
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--gut)}

h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.14;letter-spacing:-.012em;margin:0}
h1{font-size:clamp(1.55rem,2.65vw,2.35rem);font-weight:400;line-height:1.2}
h2{font-size:clamp(1.4rem,2.5vw,1.9rem);font-weight:400;color:var(--accent-deep)}
h3{font-size:clamp(1.15rem,1.9vw,1.5rem);font-weight:400;color:var(--accent-deep)}
p{margin:0 0 1em}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px;border-radius:3px}
.lbl{font-size:.688rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-soft);line-height:1.3}
.fill{color:var(--warm);border-bottom:1.5px dashed var(--warm);font-weight:500;
  padding:0 .1em;font-style:normal;overflow-wrap:anywhere}

/* One gap between sections, not two stacked on each other.
   Sections pad the top only; the last one closes the page. */
section{padding-top:var(--sec);padding-bottom:0}
section:last-of-type{padding-bottom:var(--sec)}
.sec-head{margin-bottom:clamp(22px,2.6vw,32px)}
.sec-head .lbl{display:block;margin-bottom:.8em}
.sec-head h2{max-width:24ch}

/* ============================================================ TOP BAR */
.topbar{position:sticky;top:0;z-index:60;
  background:color-mix(in srgb,var(--paper) 90%,transparent);
  backdrop-filter:saturate(1.3) blur(8px);border-bottom:1px solid var(--rule)}
.topbar .wrap{display:flex;align-items:center;gap:26px;height:56px}
.brand{font-family:var(--display);font-size:1.08rem;font-weight:600;text-decoration:none;margin-right:auto}
.topnav{display:flex;gap:20px}
.topnav a{font-size:.9rem;color:var(--ink-soft);text-decoration:none}
.topnav a:hover{color:var(--accent)}

/* ============================================================ HERO
   Photo left, words right, actions across the bottom. Sized to land
   inside one screen without scrolling. */
.hero{padding-top:clamp(26px,3.4vw,44px);padding-bottom:0}
.hero-top{display:grid;grid-template-columns:auto minmax(0,1fr);
  gap:clamp(26px,4vw,54px);align-items:center}
.hero-photo{width:clamp(210px,25vw,330px);aspect-ratio:1;border-radius:50%;
  object-fit:cover;background:var(--card);border:1px solid var(--rule)}
.hero h1{max-width:22ch;text-wrap:balance}
.hero h1 em{font-style:italic;color:var(--accent)}
.hero .intro{max-width:54ch;color:var(--ink-soft);margin:1em 0 0;font-size:.98rem}
.facts{display:flex;flex-wrap:wrap;gap:7px 20px;margin:1.2em 0 0;padding:0;list-style:none}
.facts li{font-size:.85rem;color:var(--ink-soft);display:flex;align-items:center;gap:8px}
.facts li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--warm);flex:none}

.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:clamp(26px,3vw,38px)}
.btn{font-size:.9rem;font-weight:600;text-decoration:none;padding:11px 18px;
  border:1px solid var(--rule);border-radius:var(--radius);background:var(--card);
  color:var(--ink);display:inline-flex;align-items:center;gap:7px;
  transition:background-color .2s,border-color .2s,color .2s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-deep);border-color:var(--accent-deep);color:#fff}
.btn.dead{cursor:default}
.ext{font-size:.78em;opacity:.65}

@media(max-width:860px){
  .hero-top{grid-template-columns:1fr;gap:20px}
  .hero-photo{width:124px;order:-1}
}

/* ============================================================ STATS + CLIENTS
   These open the Work section, so the Work link lands here. */
.stats{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--rule);
  border-radius:var(--radius);overflow:hidden;background:var(--card)}
.stat{padding:clamp(16px,2.2vw,24px);border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.stat:nth-child(2n){border-right:none}
.stat:nth-last-child(-n+2){border-bottom:none}
.stat .n{font-family:var(--display);font-size:clamp(1.6rem,2.9vw,2.2rem);line-height:1;font-weight:600}
.stat .n.accent{color:var(--accent)} .stat .n.warm{color:var(--warm)} .stat .n.sand{color:var(--sand)}
.stat .d{font-size:.85rem;color:var(--ink-soft);margin-top:.55em;line-height:1.45}
@media(max-width:560px){
  .stats{grid-template-columns:1fr}
  .stat{border-right:none}
  .stat:nth-last-child(-n+2){border-bottom:1px solid var(--rule)}
  .stat:last-child{border-bottom:none}
}

.clients{margin-top:clamp(20px,2.4vw,28px)}
.clients .lbl{display:block;margin-bottom:.9em}
.clients ul{display:flex;flex-wrap:wrap;gap:10px 28px;margin:0;padding:0;list-style:none}
.clients li{font-family:var(--display);font-size:clamp(1.02rem,1.5vw,1.28rem);
  font-weight:600;color:var(--ink);line-height:1.2}

/* ============================================================ CASE STUDIES
   Collapsed: words left, diagram right, one screen. The diagram lives
   outside the expander so it never appears twice. */
.case{padding-top:var(--sec);margin-top:var(--sec);border-top:1px solid var(--rule)}
.case:first-of-type{border-top:none;margin-top:clamp(30px,3.6vw,44px);padding-top:0}
.case-grid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);
  gap:clamp(24px,3.6vw,48px);align-items:start}
@media(max-width:900px){.case-grid{grid-template-columns:1fr;gap:26px}}
.case>.lbl,.case-left>.lbl{display:block;margin-bottom:.8em}
.case h3{max-width:24ch;text-wrap:balance}
.case .summary{max-width:54ch;color:var(--ink-soft);margin-top:.85em;font-size:.95rem}

.pir{display:grid;gap:7px;margin-top:clamp(13px,1.7vw,18px)}
.pir .box{border:1px solid var(--rule);border-radius:var(--radius);background:var(--card);padding:11px 15px}
.pir .box .lbl{display:block;margin-bottom:.45em}
.pir .box p{margin:0;font-size:.91rem;line-height:1.5}
.pir .box.result{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 22%,var(--rule))}
.pir .box.result .lbl{color:var(--accent)}
.pir .box.problem{background:var(--warm-soft);border-color:color-mix(in srgb,var(--warm) 22%,var(--rule))}
.pir .box.problem .lbl{color:var(--warm)}

.tags{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 0;padding:0;list-style:none}
.tag{font-size:.78rem;font-weight:500;padding:5px 11px;border-radius:999px;
  border:1px solid var(--rule);background:var(--card);color:var(--ink-soft)}
.tag.accent{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 25%,var(--rule));color:var(--accent)}
.tag.warm{background:var(--warm-soft);border-color:color-mix(in srgb,var(--warm) 28%,var(--rule));color:var(--warm)}
.tag.sand{background:var(--sand-soft);border-color:color-mix(in srgb,var(--sand) 40%,var(--rule));color:#7A6310}

.fields{margin:clamp(16px,2vw,22px) 0 0}
.fields .row{padding:9px 0;border-top:1px solid var(--rule)}
.fields .row:first-child{border-top:none;padding-top:0}
.fields dt{margin-bottom:.3em}
.fields dd{margin:0;font-size:.89rem;line-height:1.45}

details.more{margin-top:clamp(16px,2vw,22px)}
details.more>summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:9px;
  font-size:.88rem;font-weight:600;padding:9px 16px;border:1px solid var(--rule);
  border-radius:var(--radius);background:var(--card);transition:border-color .2s,color .2s}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"";width:7px;height:7px;border-right:1.8px solid currentColor;
  border-bottom:1.8px solid currentColor;transform:rotate(45deg) translate(-2px,-2px);transition:transform .22s}
details.more[open]>summary::after{transform:rotate(-135deg) translate(-1px,-1px)}
details.more>summary:hover{border-color:var(--accent);color:var(--accent)}
.more-body{padding-top:22px;max-width:68ch;animation:unfold .3s ease-out}
@keyframes unfold{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.more-body h4{font-family:var(--display);font-size:1.08rem;font-weight:600;margin:1.7em 0 .5em;color:var(--accent-deep)}
.more-body h4:first-child{margin-top:0}
.more-body p{font-size:.94rem}
.more-body ul{margin:0 0 1em;padding-left:1.15em;font-size:.94rem}
.more-body li{margin-bottom:.35em}
.more-body em{font-style:italic}

/* ============================================================ FIGURES */
.fig{border:1px solid var(--rule);border-radius:var(--radius);background:var(--card);
  padding:clamp(14px,1.9vw,20px)}
.fig + .fig{margin-top:12px}
.more-body .fig{margin:1.4em 0}
.fig-cap{font-size:.79rem;color:var(--ink-soft);margin:12px 0 0;line-height:1.45}
.fig-panel{background:var(--accent-soft);border-radius:calc(var(--radius) - 2px);padding:clamp(12px,1.7vw,18px)}
.fig-title{display:block;margin-bottom:12px}

/* routing */
.route{display:grid;gap:10px}
.route-src{font-size:.84rem;font-weight:600;text-align:center;background:var(--card);
  border:1px solid var(--rule);border-radius:calc(var(--radius) - 3px);padding:9px 12px}
.route-list{display:grid;gap:6px}
.cand{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--card);
  border:1px solid var(--rule);border-radius:calc(var(--radius) - 3px);padding:8px 12px;font-size:.84rem}
.cand b{font-weight:600}
.cand .why{color:var(--ink-soft)}
.cand .v{font-size:.69rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  white-space:nowrap;color:var(--ink-soft)}
.cand.win .v{color:var(--accent)}
.cand.no .v{color:var(--warm)}

/* OMS <-> ERP */
.sync{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch}
@media(max-width:700px){.sync{grid-template-columns:1fr}}
.sys{background:var(--card);border:1px solid var(--rule);border-radius:calc(var(--radius) - 2px);padding:12px 14px}
.sys b{display:block;font-size:.9rem;font-weight:600;margin-bottom:.25em}
.sys span{font-size:.79rem;color:var(--ink-soft);line-height:1.4}
.flows{display:grid;gap:5px;min-width:170px}
.flow{display:grid;grid-template-columns:16px 1fr;gap:6px;align-items:center;font-size:.77rem;color:var(--ink-soft)}
.flow .dir{font-weight:700;color:var(--accent);text-align:center}

/* escalation timeline — the compact diagram for case 2 */
.tl{position:relative;display:grid;gap:0;margin:0;padding:0 0 0 26px;list-style:none}
.tl::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:var(--rule)}
.tl li{position:relative;padding:8px 0;font-size:.85rem;line-height:1.4}
.tl li::before{content:"";position:absolute;left:-26px;top:13px;width:16px;height:16px;border-radius:50%;
  background:var(--card);border:2px solid var(--rule);transition:border-color .35s ease,background-color .35s ease}
.tl li.lit::before{border-color:var(--accent);background:var(--accent)}
.tl li b{font-weight:600;display:block}

/* numbered trail, used inside the expanded text */
.trail{counter-reset:s;list-style:none;margin:0 0 1em;padding:0}
.trail li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:12px;padding:11px 0;border-top:1px solid var(--rule)}
.trail li:first-child{border-top:none;padding-top:0}
.trail li::before{content:counter(s,decimal-leading-zero);font-family:var(--display);font-weight:600;color:var(--accent);font-size:.88rem;line-height:1.5}
.trail li>b{grid-column:2;font-size:.9rem;font-weight:600}
.trail li>span{grid-column:2;font-size:.88rem;color:var(--ink-soft);line-height:1.5}

/* split + table */
.split{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media(max-width:600px){.split{grid-template-columns:1fr}}
.split>div{background:var(--card);border:1px solid var(--rule);border-radius:calc(var(--radius) - 2px);padding:14px}
.split .lbl{display:block;margin-bottom:.7em;color:var(--accent)}
.split ul{margin:0;padding-left:1.05em;font-size:.85rem}
.split li{margin-bottom:.3em;color:var(--ink-soft)}
.tbl{width:100%;border-collapse:collapse;font-size:.84rem;background:var(--card)}
.tbl th,.tbl td{text-align:left;padding:8px 11px;border-bottom:1px solid var(--rule)}
.tbl th{font-size:.67rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft)}
.tbl tr:last-child td{border-bottom:none}
.tbl td:first-child{font-weight:600;width:38%}

/* ============================================================ SHORT ENTRIES */
.shorts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:var(--sec);align-items:start}
@media(max-width:820px){.shorts{grid-template-columns:1fr}}
.short{border:1px solid var(--rule);border-radius:var(--radius);background:var(--card);
  padding:clamp(18px,2.2vw,24px);display:flex;flex-direction:column}
.short .lbl{display:block;margin-bottom:.7em}
.short h3{font-size:clamp(1.08rem,1.6vw,1.26rem);margin-bottom:.5em}
.short p{font-size:.91rem;color:var(--ink-soft);margin-bottom:1em}
.short .tags{margin-top:auto}
.short-logo{width:150px;height:118px;object-fit:contain;object-position:left center;
  align-self:flex-start;margin-bottom:14px}

/* ============================================================ ABOUT */
.about-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,320px);
  gap:clamp(24px,4vw,56px);align-items:start}
@media(max-width:840px){.about-grid{grid-template-columns:1fr}}
.about-open{font-family:var(--display);font-style:italic;font-size:clamp(1.05rem,1.8vw,1.32rem);
  line-height:1.45;max-width:30ch;margin-bottom:1.2em}
.about-body{max-width:62ch;color:var(--ink-soft);font-size:.95rem}
.skill-g{margin-bottom:20px}
.skill-g:last-child{margin-bottom:0}
.skill-g .lbl{display:block;margin-bottom:.7em}
.skill-g ul{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}

/* ============================================================ CONTACT */
.clist{display:grid;gap:10px;max-width:520px}
.citem{border:1px solid var(--rule);border-radius:var(--radius);background:var(--card);padding:14px 17px}
.citem .lbl{display:block;margin-bottom:.4em}
.citem .val{font-size:1rem;font-weight:600;word-break:break-word}
.citem button,.citem a.act{margin-top:.45em;display:inline-block;background:none;border:none;padding:0;
  font-family:var(--body);font-size:.81rem;color:var(--accent);cursor:pointer;text-decoration:none}
.citem button:hover,.citem a.act:hover{text-decoration:underline}
.contact-intro{max-width:52ch;color:var(--ink-soft);margin-top:.9em}

footer{border-top:1px solid var(--rule);padding:20px 0;font-size:.85rem;color:var(--ink-soft)}

/* ============================================================ ERROR SCREEN */
.err{max-width:620px;margin:14vh auto;padding:28px;border:1px solid var(--warm);
  border-radius:var(--radius);background:var(--warm-soft)}
.err h2{font-size:1.3rem;margin-bottom:.6em;color:var(--ink)}
.err code{background:rgba(0,0,0,.07);padding:2px 5px;border-radius:3px;font-size:.88em}
.err pre{white-space:pre-wrap;font-size:.8rem;background:rgba(0,0,0,.05);padding:10px;border-radius:5px;overflow:auto}

/* ============================================================ MOTION
   1 hero arrives   2 numbers count up   3 routing resolves
   4 escalation timeline lights up   5 case study expands on click    */
.reveal{opacity:0;transform:translateY(14px);
  transition:opacity .7s cubic-bezier(.2,.6,.2,1),transform .7s cubic-bezier(.2,.6,.2,1)}
.reveal.in{opacity:1;transform:none}
.hero-photo.reveal{transform:translateY(14px) scale(.94)}
.hero-photo.reveal.in{transform:none}
.cand{transition:opacity .45s ease,transform .45s ease,background-color .45s ease,border-color .45s ease}
.js .cand{opacity:0;transform:translateX(-7px)}
.js .cand.in{opacity:1;transform:none}
.js .cand.win{background:var(--card);border-color:var(--rule)}
.js .cand.win.in{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,var(--rule))}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important}
  .reveal{opacity:1;transform:none}
  .js .cand{opacity:1;transform:none}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
"use strict";

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function safeHref(u){u=String(u||'').trim();
  return (/^(https?:\/\/|mailto:|tel:|\/|#)/i).test(u)?u:'#';}
function showFills(){return !(window.SITE&&window.SITE.showFillIns===false);}
function isEmptyAfterFills(s){
  if(typeof s!=='string') return true;
  if(showFills()) return s.trim()==='';
  return s.replace(/\[\[.*?\]\]/g,'').trim()==='';
}
function has(s){return typeof s==='string'&&s.trim()!==''&&!isEmptyAfterFills(s);}
function isTodo(s){return typeof s==='string'&&s.indexOf('[[')!==-1;}
function fmt(s){
  if(s==null||s==='') return '';
  return esc(s)
    .replace(/\[\[(.+?)\]\]/g, showFills()?'<span class="fill">$1</span>':'')
    .replace(/\[([^\[\]]+)\]\(([^)\s]+)\)/g,function(_,t,u){
      return '<a href="'+esc(safeHref(u))+'" target="_blank" rel="noopener">'+t+'</a>';})
    .replace(/\*([^*]+)\*/g,'<em>$1</em>');
}

/* ---------- figures ---------- */
var FIGURES={
  routing:function(){
    var rows=[['Store A','below safety stock','not eligible','no'],
              ['Store B','stock held by an earlier order','not eligible','no'],
              ['Store C','available to promise clears the line','selected','win'],
              ['Warehouse','eligible, higher cost to serve','fallback','']];
    return '<div class="fig"><span class="lbl fig-title">Where the order gets served from</span>'+
      '<div class="fig-panel"><div class="route">'+
      '<div class="route-src">Order received</div><div class="route-list">'+
      rows.map(function(r){return '<div class="cand '+r[3]+'">'+
        '<span><b>'+esc(r[0])+'</b> <span class="why">— '+esc(r[1])+'</span></span>'+
        '<span class="v">'+esc(r[2])+'</span></div>';}).join('')+
      '</div></div></div>'+
      '<p class="fig-cap">Every row is a separate conversation about buffers, holds and cost to serve. A spec that doesn’t name all four comes back in UAT.</p></div>';
  },

  sync:function(){
    var flows=[['→','Orders and fulfilment'],['←','Item and inventory records'],
               ['→','Shipments and returns'],['←','Financial posting']];
    return '<div class="fig"><span class="lbl fig-title">Who owns which number</span>'+
      '<div class="fig-panel"><div class="sync">'+
      '<div class="sys"><b>HotWax OMS</b><span>order lifecycle, allocation, fulfilment</span></div>'+
      '<div class="flows">'+flows.map(function(f){
        return '<div class="flow"><span class="dir">'+f[0]+'</span><span>'+esc(f[1])+'</span></div>';
      }).join('')+'</div>'+
      '<div class="sys"><b>NetSuite</b><span>item master, stock record, the books</span></div>'+
      '</div></div>'+
      '<p class="fig-cap">Every arrow is a field-ownership decision. The integrations that fail are the ones where two systems both believe they own the same number.</p></div>';
  },

  /* compact vertical timeline — case study 2's diagram */
  timeline:function(c){
    var steps=c.figureSteps||[];
    if(!steps.length) return '';
    return '<div class="fig"><span class="lbl fig-title">'+esc(c.figureTitle||'How an escalation runs')+'</span>'+
      '<ol class="tl">'+steps.map(function(s){
        return '<li><b>'+fmt(s.b)+'</b></li>';}).join('')+'</ol>'+
      (has(c.figureCaption)?'<p class="fig-cap">'+fmt(c.figureCaption)+'</p>':'')+'</div>';
  },

  vitaran:function(){
    return '<div class="fig"><div class="fig-panel"><div class="split">'+
      '<div><span class="lbl">Administrator</span><ul>'+
      '<li>Customers and their individual rates</li><li>Inventory as it moves</li>'+
      '<li>Delivery activity across routes</li><li>Expenses and invoicing</li></ul></div>'+
      '<div><span class="lbl">Delivery worker</span><ul>'+
      '<li>Today’s route, nothing else</li><li>Mark delivered, adjust quantity</li>'+
      '<li>On a phone, standing, in a hurry</li></ul></div>'+
      '</div></div><p class="fig-cap">Not one product with permissions — two products.</p></div>';
  },

  loadramp:function(){
    var rows=[['Thread group, ramped','Staff signing in over a window, not all at once'],
              ['Think time','A real person reading a screen before tapping'],
              ['Journey, not endpoint','The full picking and packing flow, in order'],
              ['Response assertions','Catches a fast reply that is actually an error'],
              ['Percentile reporting','The slow tail, which is what the counter feels']];
    return '<div class="fig"><table class="tbl"><thead><tr><th>Element</th><th>What it represents</th></tr></thead><tbody>'+
      rows.map(function(r){return '<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td></tr>';}).join('')+
      '</tbody></table></div>';
  }
};

/* ---------- sections ---------- */
function topbar(S){
  return '<header class="topbar"><div class="wrap">'+
    '<a class="brand" href="#top">'+esc(S.brand)+'</a><nav class="topnav">'+
    (S.nav||[]).map(function(n){return '<a href="'+esc(n.href)+'">'+esc(n.label)+'</a>';}).join('')+
    '</nav></div></header>';
}

function hero(S){
  var h=S.hero||{};
  var acts=(h.actions||[]).map(function(a){
    var cls='btn'+(a.primary?' primary':'');
    var tail=a.external?'<span class="ext">↗</span>':'';
    if(isTodo(a.href)) return '<span class="'+cls+' dead">'+esc(a.label)+' '+fmt(a.href)+'</span>';
    return '<a class="'+cls+'" href="'+esc(a.href)+'"'+(a.external?' target="_blank" rel="noopener"':'')+'>'+
      esc(a.label)+tail+'</a>';
  }).join('');

  return '<section class="hero" id="top"><div class="wrap">'+
    '<div class="hero-top">'+
      (has(h.photo)?'<img class="hero-photo reveal" src="'+esc(h.photo)+'" alt="Vidhan Sharma">':'')+
      '<div class="hero-text">'+
        '<h1 class="reveal">'+fmt(h.headline)+'</h1>'+
        (has(h.intro)?'<p class="intro reveal">'+fmt(h.intro)+'</p>':'')+
        ((h.facts||[]).length?'<ul class="facts reveal">'+
          h.facts.map(function(f){return '<li>'+fmt(f)+'</li>';}).join('')+'</ul>':'')+
      '</div>'+
    '</div>'+
    (acts?'<div class="acts reveal">'+acts+'</div>':'')+
    '</div></section>';
}

function statsBlock(S){
  var h=S.hero||{};
  var stats=(h.stats||[]).filter(function(s){
    return !isEmptyAfterFills(String(s.value==null?'':s.value));
  }).map(function(s){
    var v=String(s.value==null?'':s.value), m=/^(\d+)(.*)$/.exec(v), attr='';
    if(m) attr=' data-count="'+m[1]+'" data-suffix="'+esc(m[2])+'"';
    return '<div class="stat"><div class="n '+esc(s.tone||'')+'"'+attr+'>'+fmt(s.value)+'</div>'+
           '<div class="d">'+fmt(s.label)+'</div></div>';
  }).join('');
  var clients=(h.clients||[]).length
    ? '<div class="clients"><span class="lbl">'+esc(h.clientsLabel||'')+'</span><ul>'+
      h.clients.map(function(c){return '<li>'+esc(c)+'</li>';}).join('')+'</ul></div>' : '';
  return (stats?'<div class="stats">'+stats+'</div>':'')+clients;
}

function shortBlock(c){
  var tags=(c.tags||[]).filter(function(t){return !isEmptyAfterFills(t.text);})
    .map(function(t){return '<li class="tag '+esc(t.tone||'')+'">'+fmt(t.text)+'</li>';}).join('');
  var link='';
  if(c.link&&has(c.link.label)){
    link = (isTodo(c.link.label)||!has(c.link.href))
      ? '<p>'+fmt(c.link.label)+'</p>'
      : '<p><a href="'+esc(safeHref(c.link.href))+'" target="_blank" rel="noopener">'+esc(c.link.label)+'</a></p>';
  }
  return '<article class="short">'+
    (has(c.logo)?'<img class="short-logo" src="'+esc(c.logo)+'" alt="" loading="lazy">':'')+
    (has(c.eyebrow)?'<span class="lbl">'+esc(c.eyebrow)+'</span>':'')+
    '<h3>'+fmt(c.title)+'</h3>'+
    (has(c.summary)?'<p>'+fmt(c.summary)+'</p>':'')+link+
    (tags?'<ul class="tags">'+tags+'</ul>':'')+'</article>';
}

function caseBlock(c){
  var pir=(c.cards||[]).map(function(b){
    var k=(b.label||'').toLowerCase();
    var cls=k==='result'?'result':(k==='problem'?'problem':'');
    return '<div class="box '+cls+'"><span class="lbl">'+esc(b.label)+'</span><p>'+fmt(b.text)+'</p></div>';
  }).join('');

  var tags=(c.tags||[]).filter(function(t){return !isEmptyAfterFills(t.text);})
    .map(function(t){return '<li class="tag '+esc(t.tone||'')+'">'+fmt(t.text)+'</li>';}).join('');

  var fields='';
  if(c.fields){
    var rows=[];
    for(var k in c.fields){
      if(has(c.fields[k])) rows.push('<div class="row"><dt class="lbl">'+esc(k)+'</dt><dd>'+fmt(c.fields[k])+'</dd></div>');
    }
    if(rows.length) fields='<dl class="fields">'+rows.join('')+'</dl>';
  }

  /* the collapsed diagram — rendered once, outside the expander */
  var fig = (has(c.figure)&&FIGURES[c.figure]) ? FIGURES[c.figure](c) : '';

  var long='';
  if((c.long||[]).length){
    long='<details class="more"><summary>Read the full case study</summary><div class="more-body">'+
      c.long.map(function(b){
        var out = has(b.h) ? '<h4>'+fmt(b.h)+'</h4>' : '';
        (b.p||[]).forEach(function(p){ if(!isEmptyAfterFills(p)) out+='<p>'+fmt(p)+'</p>'; });
        if((b.steps||[]).length){
          out+='<ol class="trail">'+b.steps.map(function(s){
            return '<li><b>'+fmt(s.b)+'</b><span>'+fmt(s.t)+'</span></li>';}).join('')+'</ol>';
        }
        if((b.list||[]).length){
          out+='<ul>'+b.list.filter(function(i){return !isEmptyAfterFills(i);})
            .map(function(i){return '<li>'+fmt(i)+'</li>';}).join('')+'</ul>';
        }
        /* a second diagram, only ever shown inside the expanded text */
        if(has(b.figure)&&FIGURES[b.figure]) out+=FIGURES[b.figure](c);
        return out;
      }).join('')+'</div></details>';
  }

  return '<article class="case"><div class="case-grid">'+
    '<div class="case-left">'+
      (has(c.eyebrow)?'<span class="lbl">'+esc(c.eyebrow)+'</span>':'')+
      '<h3>'+fmt(c.title)+'</h3>'+
      (has(c.summary)?'<p class="summary">'+fmt(c.summary)+'</p>':'')+
      (pir?'<div class="pir">'+pir+'</div>':'')+
      (tags?'<ul class="tags">'+tags+'</ul>':'')+
      long+
    '</div>'+
    '<div class="case-right">'+fig+fields+'</div>'+
  '</div></article>';
}

function work(S){
  var w=S.workIntro||{}, all=S.cases||[];
  var full=all.filter(function(c){return !c.compact;});
  var shorts=all.filter(function(c){return !!c.compact;});
  return '<section id="work"><div class="wrap">'+
    statsBlock(S)+
    '<div class="sec-head" style="margin-top:var(--sec)">'+
      (has(w.eyebrow)?'<span class="lbl">'+esc(w.eyebrow)+'</span>':'')+
      '<h2>'+fmt(w.title)+'</h2></div>'+
    full.map(caseBlock).join('')+
    (shorts.length?'<div class="shorts">'+shorts.map(shortBlock).join('')+'</div>':'')+
    '</div></section>';
}

function about(S){
  var a=S.about||{};
  var groups=(a.skillGroups||[]).map(function(g){
    return '<div class="skill-g"><span class="lbl">'+esc(g.label)+'</span><ul>'+
      (g.items||[]).map(function(i){return '<li class="tag">'+fmt(i)+'</li>';}).join('')+'</ul></div>';
  }).join('');
  return '<section id="about"><div class="wrap"><div class="sec-head">'+
    (has(a.eyebrow)?'<span class="lbl">'+esc(a.eyebrow)+'</span>':'')+
    '<h2>'+fmt(a.title)+'</h2></div>'+
    '<div class="about-grid"><div>'+
      (has(a.photo)?'<img class="hero-photo" style="width:124px;margin-bottom:18px" src="'+esc(a.photo)+'" alt="">':'')+
      (has(a.opening)?'<p class="about-open">'+fmt(a.opening)+'</p>':'')+
      '<div class="about-body">'+(a.paragraphs||[]).filter(function(p){return !isEmptyAfterFills(p);})
        .map(function(p){return '<p>'+fmt(p)+'</p>';}).join('')+'</div>'+
    '</div><div>'+groups+'</div></div></div></section>';
}

function contact(S){
  var c=S.contact||{};
  var items=(c.items||[]).map(function(it){
    var act='';
    if(it.action==='copy'&&!isTodo(it.value)) act='<button type="button" data-copy="'+esc(it.value)+'">Copy</button>';
    else if(it.action==='open'&&has(it.href)&&!isTodo(it.href))
      act='<a class="act" href="'+esc(safeHref(it.href))+'" target="_blank" rel="noopener">Open ↗</a>';
    return '<div class="citem"><span class="lbl">'+esc(it.label)+'</span>'+
      '<div class="val">'+fmt(it.value)+'</div>'+act+'</div>';
  }).join('');
  return '<section id="contact"><div class="wrap"><div class="sec-head">'+
    (has(c.eyebrow)?'<span class="lbl">'+esc(c.eyebrow)+'</span>':'')+
    '<h2>'+fmt(c.title)+'</h2>'+
    (has(c.intro)?'<p class="contact-intro">'+fmt(c.intro)+'</p>':'')+
    '</div><div class="clist">'+items+'</div></div></section>';
}

/* ---------- motion ---------- */
function countUp(n){
  var target=parseInt(n.getAttribute('data-count'),10);
  if(isNaN(target)) return;
  var suffix=n.getAttribute('data-suffix')||'',start=null,dur=950;
  function step(ts){
    if(start===null) start=ts;
    var k=Math.min(1,(ts-start)/dur); k=1-Math.pow(1-k,3);
    n.textContent=Math.round(target*k)+suffix;
    if(k<1) requestAnimationFrame(step);
  }
  n.textContent='0'+suffix; requestAnimationFrame(step);
}

function motion(){
  var reduce=false;
  try{reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
  if(reduce||!('IntersectionObserver' in window)){
    document.querySelectorAll('.reveal,.cand').forEach(function(n){n.classList.add('in');});
    document.querySelectorAll('.tl li').forEach(function(n){n.classList.add('lit');});
    return;
  }
  document.documentElement.classList.add('js');

  /* 1 — the hero arrives */
  var items=[].slice.call(document.querySelectorAll('.hero .reveal'));
  items.forEach(function(n,i){n.style.transitionDelay=(i*110)+'ms';});
  requestAnimationFrame(function(){items.forEach(function(n){n.classList.add('in');});});

  /* 2, 3, 4 — on first sight */
  var io=new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(!e.isIntersecting) return;
      var t=e.target;
      if(t.classList.contains('stats')){
        t.querySelectorAll('[data-count]').forEach(function(n,i){
          setTimeout(function(){countUp(n);},i*140);
        });
      }else if(t.classList.contains('route-list')){
        t.querySelectorAll('.cand').forEach(function(c,i){
          setTimeout(function(){c.classList.add('in');},i*230);
        });
      }else if(t.classList.contains('tl')){
        t.querySelectorAll('li').forEach(function(li,i){
          setTimeout(function(){li.classList.add('lit');},i*170);
        });
      }
      io.unobserve(t);
    });
  },{threshold:.3});
  document.querySelectorAll('.stats,.route-list,.tl').forEach(function(n){io.observe(n);});
}

/* ---------- boot ---------- */
function fail(msg,detail){
  document.getElementById('app').innerHTML=
    '<div class="err"><h2>content.js has a small error</h2><p>'+msg+'</p>'+
    '<p>Almost always a missing <code>"</code> quote, a missing <code>,</code> comma, or a deleted <code>{ }</code> bracket.</p>'+
    '<p><b>To fix:</b> open the file on github.com, press History, and revert your last change.</p>'+
    (detail?'<pre>'+esc(detail)+'</pre>':'')+'</div>';
}

try{
  var S=window.SITE;
  if(!S){ fail('The file did not load, so the page has no content to show.',''); return; }
  document.getElementById('app').innerHTML=
    topbar(S)+'<main>'+hero(S)+work(S)+about(S)+contact(S)+'</main>'+
    '<footer><div class="wrap">'+esc((S.meta&&S.meta.footer)||'')+'</div></footer>';
  motion();

  document.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('button[data-copy]');
    if(!b) return;
    var txt=b.getAttribute('data-copy'),old=b.textContent;
    try{
      navigator.clipboard.writeText(txt).then(function(){
        b.textContent='Copied'; setTimeout(function(){b.textContent=old;},1600);
      },function(){ b.textContent='Press Ctrl+C'; setTimeout(function(){b.textContent=old;},2000); });
    }catch(err){ b.textContent='Press Ctrl+C'; setTimeout(function(){b.textContent=old;},2000); }
  });
}catch(err){ fail('The site could not be built from the file.',err&&err.message); }
})();
</script>
