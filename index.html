<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">

<!-- These three lines control the Google / LinkedIn / WhatsApp preview.
     Edit them in content.js (meta section) AND here, since previews are
     read before the page runs. -->
<title>Vidhan Sharma — Product, enterprise order management</title>
<meta name="description" content="Product Associate at HotWax Commerce. Enterprise order management, inventory availability, fulfilment routing and system integrations.">
<meta property="og:title" content="Vidhan Sharma — Product, enterprise order management">
<meta property="og:description" content="Product Associate working on the OMS layer: inventory availability, order routing, fulfilment and integrations.">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="content.js"></script>
<script>
/* Pull fonts + theme out of content.js and apply them before paint. */
(function(){
  try{
    var S = window.SITE; if(!S) return;
    if(S.fonts && S.fonts.googleFonts){
      var l=document.createElement('link'); l.rel='stylesheet';
      l.href='https://fonts.googleapis.com/css2?family='+S.fonts.googleFonts+'&display=swap';
      document.head.appendChild(l);
    }
    var t=S.theme||{}, r=document.documentElement;
    var map={paper:'--paper',card:'--card',ink:'--ink',inkSoft:'--ink-soft',rule:'--rule',
             accent:'--accent',accentSoft:'--accent-soft',accentDeep:'--accent-deep',
             warm:'--warm',warmSoft:'--warm-soft',sand:'--sand',sandSoft:'--sand-soft',
             radius:'--radius',maxWidth:'--maxw'};
    for(var k in map){ if(t[k]) r.style.setProperty(map[k], t[k]); }
    if(S.fonts){
      if(S.fonts.display) r.style.setProperty('--display', S.fonts.display);
      if(S.fonts.body)    r.style.setProperty('--body', S.fonts.body);
    }
    if(S.meta){
      if(S.meta.tabTitle) document.title=S.meta.tabTitle;
      if(S.meta.favicon){
        var f=document.createElement('link'); f.rel='icon'; f.href=S.meta.favicon;
        document.head.appendChild(f);
      }
    }
  }catch(e){}
})();
</script>

<style>
/* ============================================================
   DEFAULTS — content.js overrides these. Don't edit here.
   ============================================================ */
:root{
  --paper:#F9FAF5; --card:#FFFFFD; --ink:#252B26; --ink-soft:#6B7268;
  --rule:#E2E6DD; --accent:#4A7C56; --accent-soft:#EBF2EB; --accent-deep:#2F5639;
  --warm:#C87A68; --warm-soft:#F7E9E5; --sand:#C9A227; --sand-soft:#F6EFD8;
  --radius:10px; --maxw:1080px;
  --display:'Source Serif 4',Georgia,serif;
  --body:'Public Sans',system-ui,sans-serif;
  --gut:clamp(20px,5vw,48px);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--body);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--gut)}

/* ---------- type ---------- */
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.14;letter-spacing:-.012em;margin:0}
h1{font-size:clamp(2rem,4.6vw,3.3rem);font-weight:400;line-height:1.16}
h2{font-size:clamp(1.5rem,2.9vw,2.1rem);font-weight:400}
h3{font-size:clamp(1.25rem,2.2vw,1.72rem);font-weight:400}
p{margin:0 0 1em}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px;border-radius:3px}

/* the small tracked uppercase label used everywhere in the reference */
.lbl{
  font-size:.688rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-soft);line-height:1.3;
}

/* fill-in marker */
.fill{
  color:var(--warm);border-bottom:1.5px dashed var(--warm);
  font-weight:500;padding:0 .1em;font-style:normal;overflow-wrap:anywhere;
}

section{padding:clamp(48px,6.5vw,86px) 0}
.sec-head{margin-bottom:clamp(26px,3.4vw,42px)}
.sec-head .lbl{margin-bottom:.95em;display:block}
.sec-head h2{max-width:24ch}

/* ============================================================
   TOP BAR
   ============================================================ */
.topbar{
  position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--paper) 90%,transparent);
  backdrop-filter:saturate(1.3) blur(8px);border-bottom:1px solid var(--rule);
}
.topbar .wrap{display:flex;align-items:center;gap:26px;height:58px}
.brand{font-family:var(--display);font-size:1.08rem;font-weight:600;text-decoration:none;margin-right:auto}
.topnav{display:flex;gap:20px}
.topnav a{font-size:.9rem;color:var(--ink-soft);text-decoration:none}
.topnav a:hover{color:var(--accent)}

/* ============================================================
   HERO
   ============================================================ */
.hero{padding-top:clamp(40px,6vw,74px);padding-bottom:clamp(34px,4.5vw,56px)}
.hero-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:clamp(24px,4vw,56px);align-items:start}
.hero-top.no-photo{grid-template-columns:1fr}
.hero-photo{
  width:clamp(170px,19vw,245px);aspect-ratio:1;border-radius:50%;object-fit:cover;
  background:var(--card);border:1px solid var(--rule);justify-self:end;margin-top:6px;
}
@media(max-width:840px){
  .hero-top{grid-template-columns:1fr;gap:20px}
  .hero-photo{width:104px;justify-self:start;order:-1;margin-top:0}
}
.hero h1{max-width:21ch;text-wrap:balance}
.hero h1 em{font-style:italic;color:var(--accent)}
.hero .intro{max-width:56ch;color:var(--ink-soft);margin-top:1.15em;font-size:1.02rem}
.facts{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:1.5em;padding:0;list-style:none}
.facts li{font-size:.86rem;color:var(--ink-soft);display:flex;align-items:center;gap:8px}
.facts li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--warm);flex:none}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:1.8em}
.btn{
  font-size:.9rem;font-weight:600;text-decoration:none;
  padding:10px 17px;border:1px solid var(--rule);border-radius:var(--radius);
  background:var(--card);color:var(--ink);display:inline-flex;align-items:center;gap:7px;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.dead{cursor:default;opacity:.95}
.btn.dead:hover{border-color:var(--rule);color:var(--ink)}
.ext{font-size:.78em;opacity:.65}

.stats{
  display:grid;grid-template-columns:1fr 1fr;margin-top:clamp(32px,4vw,48px);
  border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden;background:var(--card);
}
.stat{padding:clamp(18px,2.4vw,26px);border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.stat:nth-child(2n){border-right:none}
.stat:nth-last-child(-n+2){border-bottom:none}
.stat .n{font-family:var(--display);font-size:clamp(1.65rem,3vw,2.3rem);line-height:1;font-weight:600}
.stat .n.accent{color:var(--accent)} .stat .n.warm{color:var(--warm)}
.stat .d{font-size:.86rem;color:var(--ink-soft);margin-top:.6em;line-height:1.45}
@media(max-width:560px){
  .stats{grid-template-columns:1fr}
  .stat{border-right:none}
  .stat:nth-last-child(-n+2){border-bottom:1px solid var(--rule)}
  .stat:last-child{border-bottom:none}
}

/* ============================================================
   CASE STUDIES
   ============================================================ */
.case{padding-top:clamp(34px,4.4vw,58px);margin-top:clamp(34px,4.4vw,58px);border-top:1px solid var(--rule)}
.case:first-of-type{border-top:none;margin-top:0;padding-top:0}
.case>.lbl{display:block;margin-bottom:.9em}
.case h3{max-width:26ch;text-wrap:balance}
.case .summary{max-width:62ch;color:var(--ink-soft);margin-top:.95em;font-size:.98rem}

.pir{display:grid;gap:9px;margin-top:clamp(22px,2.8vw,32px)}
.pir .box{border:1px solid var(--rule);border-radius:var(--radius);background:var(--card);padding:15px 18px}
.pir .box .lbl{display:block;margin-bottom:.5em}
.pir .box p{margin:0;font-size:.95rem}
.pir .box.result{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 22%,var(--rule))}
.pir .box.result .lbl{color:var(--accent)}
.pir .box.problem .lbl{color:var(--warm)}

.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;padding:0;list-style:none}
.tag{
  font-size:.8rem;font-weight:500;padding:5px 12px;border-radius:999px;
  border:1px solid var(--rule);background:var(--card);color:var(--ink-soft);
}
.tag.accent{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 25%,var(--rule));color:var(--accent)}
.tag.warm{background:var(--warm-soft);border-color:color-mix(in srgb,var(--warm) 28%,var(--rule));color:var(--warm)}

.case-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,310px);gap:clamp(22px,3.5vw,46px);align-items:start;margin-top:clamp(24px,3vw,34px)}
@media(max-width:840px){.case-grid{grid-template-columns:1fr}}
.fields{margin:0}
.fields .row{padding:11px 0;border-top:1px solid var(--rule)}
.fields .row:first-child{border-top:none;padding-top:0}
.fields dt{margin-bottom:.35em}
.fields dd{margin:0;font-size:.92rem;line-height:1.45}

details.more{margin-top:clamp(20px,2.6vw,28px)}
details.more>summary{
  list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:9px;
  font-size:.9rem;font-weight:600;padding:9px 16px;
  border:1px solid var(--rule);border-radius:var(--radius);background:var(--card);
}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"";width:7px;height:7px;border-right:1.8px solid currentColor;border-bottom:1.8px solid currentColor;transform:rotate(45deg) translate(-2px,-2px);transition:transform .22s}
details.more[open]>summary::after{transform:rotate(-135deg) translate(-1px,-1px)}
details.more>summary:hover{border-color:var(--accent);color:var(--accent)}
.more-body{padding-top:26px;max-width:66ch;animation:unfold .3s ease-out}
@keyframes unfold{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.more-body h4{font-family:var(--display);font-size:1.12rem;font-weight:600;margin:1.8em 0 .5em;color:var(--accent)}
.more-body h4:first-child{margin-top:0}
.more-body ul{margin:0 0 1em;padding-left:1.15em}
.more-body li{margin-bottom:.35em}
.more-body em{font-style:italic}

/* ============================================================
   FIGURES
   ============================================================ */
.fig{border:1px solid var(--rule);border-radius:var(--radius);background:var(--card);padding:clamp(16px,2.3vw,24px);margin-top:clamp(22px,2.8vw,32px)}
.fig-cap{font-size:.82rem;color:var(--ink-soft);margin:14px 0 0;line-height:1.45}
.fig-panel{background:var(--accent-soft);border-radius:calc(var(--radius) - 2px);padding:clamp(14px,2vw,20px)}

/* routing */
.route{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
@media(max-width:600px){.route{grid-template-columns:1fr}}
.route-src{
  font-size:.86rem;font-weight:600;text-align:center;background:var(--card);
  border:1px solid var(--rule);border-radius:var(--radius);padding:14px 12px;line-height:1.3;
}
.route-list{display:grid;gap:7px}
.cand{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;
  background:var(--card);border:1px solid var(--rule);border-radius:calc(var(--radius) - 3px);padding:9px 13px;font-size:.88rem}
.cand b{font-weight:600}
.cand .why{color:var(--ink-soft)}
.cand .v{font-size:.73rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;color:var(--ink-soft)}
.cand.win{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,var(--rule))}
.cand.win .v{color:var(--accent)}
.cand.no .v{color:var(--warm)}

/* OMS <-> ERP sync */
.sync{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch}
@media(max-width:700px){.sync{grid-template-columns:1fr;gap:10px}}
.sys{background:var(--card);border:1px solid var(--rule);border-radius:calc(var(--radius) - 2px);padding:14px 16px}
.sys b{display:block;font-size:.95rem;font-weight:600;margin-bottom:.3em}
.sys span{font-size:.82rem;color:var(--ink-soft);line-height:1.4}
.flows{display:grid;gap:6px;min-width:190px}
.flow{display:grid;grid-template-columns:18px 1fr;gap:7px;align-items:center;font-size:.8rem;color:var(--ink-soft)}
.flow .dir{font-weight:700;color:var(--accent);text-align:center}

/* availability breakdown */
.avail{display:grid;gap:8px}
.arow{display:grid;grid-template-columns:150px 1fr 54px;gap:12px;align-items:center;font-size:.86rem}
@media(max-width:560px){.arow{grid-template-columns:110px 1fr 46px;gap:8px;font-size:.8rem}}
.abar{height:16px;border-radius:3px;background:var(--rule)}
.abar.i{background:color-mix(in srgb,var(--ink) 55%,var(--paper))}
.abar.w{background:var(--warm)}
.abar.a{background:var(--accent)}
.arow .v{text-align:right;font-weight:600}

/* numbered trail */
.trail{counter-reset:s;list-style:none;margin:0;padding:0}
.trail li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:14px;padding:13px 0;border-top:1px solid var(--rule)}
.trail li:first-child{border-top:none;padding-top:0}
.trail li::before{content:counter(s,decimal-leading-zero);font-family:var(--display);font-weight:600;color:var(--accent);font-size:.92rem;line-height:1.55}
.trail li>b{grid-column:2;font-size:.92rem;font-weight:600}
.trail li>span{grid-column:2;font-size:.9rem;color:var(--ink-soft);line-height:1.5}

/* vitaran split */
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.split{grid-template-columns:1fr}}
.split>div{background:var(--card);border:1px solid var(--rule);border-radius:calc(var(--radius) - 2px);padding:16px}
.split .lbl{display:block;margin-bottom:.8em;color:var(--accent)}
.split ul{margin:0;padding-left:1.05em;font-size:.89rem}
.split li{margin-bottom:.35em;color:var(--ink-soft)}

/* load ramp table */
.tbl{width:100%;border-collapse:collapse;font-size:.88rem;background:var(--card)}
.tbl th,.tbl td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--rule)}
.tbl th{font-size:.688rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft)}
.tbl tr:last-child td{border-bottom:none}
.tbl td:first-child{font-weight:600;width:38%}

/* ---------- third accent + compact entries + images ---------- */
.stat .n.sand{color:var(--sand)}
.tag.sand{background:var(--sand-soft);border-color:color-mix(in srgb,var(--sand) 40%,var(--rule));color:#7A6310}
.pir .box.problem{background:var(--warm-soft);border-color:color-mix(in srgb,var(--warm) 22%,var(--rule))}
.more-body h4{color:var(--accent-deep)}
.case h3{color:var(--accent-deep)}
.sec-head h2{color:var(--accent-deep)}

/* the retailer line under the hero stats */
.clients{margin-top:clamp(22px,2.6vw,30px);border-top:1px solid var(--rule);padding-top:16px}
.clients .lbl{display:block;margin-bottom:.7em}
.clients ul{display:flex;flex-wrap:wrap;gap:7px 10px;margin:0;padding:0;list-style:none}
.clients li{font-family:var(--display);font-size:.98rem;font-weight:600;color:var(--ink)}
.clients li:not(:last-child)::after{content:"·";margin-left:10px;color:var(--rule);font-weight:400}

/* short entries */
.shorts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:clamp(30px,4vw,48px)}
@media(max-width:820px){.shorts{grid-template-columns:1fr}}
.short{border:1px solid var(--rule);border-radius:var(--radius);background:var(--card);padding:clamp(18px,2.3vw,24px);display:flex;flex-direction:column}
.short .lbl{display:block;margin-bottom:.7em}
.short h3{font-size:clamp(1.1rem,1.7vw,1.3rem);margin-bottom:.5em}
.short p{font-size:.93rem;color:var(--ink-soft);margin-bottom:1em}
.short .tags{margin-top:auto}
.short-logo{width:150px;height:62px;object-fit:contain;object-position:left center;align-self:flex-start;margin-bottom:16px}

/* ============================================================
   ABOUT
   ============================================================ */
.about-photo{width:132px;height:132px;border-radius:50%;object-fit:cover;
  border:1px solid var(--rule);background:var(--card);margin-bottom:20px}
.about-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,330px);gap:clamp(24px,4vw,56px);align-items:start}
@media(max-width:840px){.about-grid{grid-template-columns:1fr}}
.about-open{font-family:var(--display);font-style:italic;font-size:clamp(1.1rem,1.9vw,1.4rem);line-height:1.45;max-width:30ch;margin-bottom:1.3em}
.about-body{max-width:62ch;color:var(--ink-soft);font-size:.97rem}
.skill-g{margin-bottom:22px}
.skill-g .lbl{display:block;margin-bottom:.75em}
.skill-g ul{display:flex;flex-wrap:wrap;gap:7px;margin:0;padding:0;list-style:none}

/* ============================================================
   CONTACT
   ============================================================ */
.clist{display:grid;gap:10px;max-width:520px}
.citem{border:1px solid var(--rule);border-radius:var(--radius);background:var(--card);padding:15px 18px}
.citem .lbl{display:block;margin-bottom:.45em}
.citem .val{font-size:1.02rem;font-weight:600;word-break:break-word}
.citem button,.citem a.act{
  margin-top:.5em;display:inline-block;background:none;border:none;padding:0;
  font-family:var(--body);font-size:.82rem;color:var(--accent);cursor:pointer;text-decoration:none;
}
.citem button:hover,.citem a.act:hover{text-decoration:underline}

footer{border-top:1px solid var(--rule);padding:22px 0;font-size:.85rem;color:var(--ink-soft)}

/* ============================================================
   ERROR SCREEN (shown if content.js has a typo)
   ============================================================ */
.err{max-width:620px;margin:14vh auto;padding:28px;border:1px solid var(--warm);
  border-radius:var(--radius);background:var(--warm-soft)}
.err h2{font-size:1.3rem;margin-bottom:.6em}
.err code{background:rgba(0,0,0,.07);padding:2px 5px;border-radius:3px;font-size:.88em}
.err pre{white-space:pre-wrap;font-size:.8rem;background:rgba(0,0,0,.05);padding:10px;border-radius:5px;overflow:auto}

/* ============================================================
   MOTION
   Four moments only, each with a job:
   1. hero settles on load          — gives the page a beginning
   2. stat numbers count up         — sends the eye to the numbers
   3. routing decision resolves     — shows a decision being made
   4. case study expands            — answers a click
   Nothing else moves. No hover lifts, no scroll reveals on every section.
   ============================================================ */
.reveal{opacity:0;transform:translateY(10px);
  transition:opacity .6s cubic-bezier(.2,.6,.2,1),transform .6s cubic-bezier(.2,.6,.2,1)}
.reveal.in{opacity:1;transform:none}

.cand{transition:opacity .45s ease,transform .45s ease,background-color .45s ease,border-color .45s ease}
.js .cand{opacity:0;transform:translateX(-7px)}
.js .cand.in{opacity:1;transform:none}
.js .cand.win{background:var(--card);border-color:var(--rule)}
.js .cand.win.in{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,var(--rule))}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important}
  .reveal{opacity:1;transform:none}
  .js .cand{opacity:1;transform:none}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
"use strict";

/* ---------- helpers ---------- */
function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
/* escape, then apply the two bits of mini-markup from content.js */
function safeHref(u){
  u=String(u||'').trim();
  return (/^(https?:\/\/|mailto:|tel:|\/|#)/i).test(u) ? u : '#';
}
function fmt(s){
  if(s==null||s==='') return '';
  return esc(s)
    /* [[fill-in]] first, so it can't be mistaken for a link */
    .replace(/\[\[(.+?)\]\]/g, showFills() ? '<span class="fill">$1</span>' : '')
    /* [text](url) */
    .replace(/\[([^\[\]]+)\]\(([^)\s]+)\)/g, function(_,t,u){
      return '<a href="'+esc(safeHref(u))+'" target="_blank" rel="noopener">'+t+'</a>';
    })
    .replace(/\*([^*]+)\*/g,'<em>$1</em>');
}
function isTodo(s){ return typeof s==='string' && s.indexOf('[[')!==-1; }
/* When showFillIns is off, a [[note]] renders as nothing. A value that was
   ONLY a note then has nothing left to show, so its row/tile/line is skipped. */
function showFills(){ return !(window.SITE && window.SITE.showFillIns===false); }
function isEmptyAfterFills(s){
  if(typeof s!=='string') return true;
  if(showFills()) return s.trim()==='';
  return s.replace(/\[\[.*?\]\]/g,'').trim()==='';
}
function has(s){ return typeof s==='string' && s.trim()!=='' && !isEmptyAfterFills(s); }
function el(html){ var d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstElementChild; }

/* ---------- figures ---------- */
var FIGURES = {

  routing: function(){
    var rows = [
      ['Store A','nearest, but below safety stock','not eligible','no'],
      ['Store B','stock held by an earlier allocation','not eligible','no'],
      ['Store C','available to promise clears the full line','selected','win'],
      ['Warehouse','eligible, higher cost to serve','fallback','']
    ];
    return '<div class="fig"><div class="fig-panel"><div class="route">'+
      '<div class="route-src">Order<br>received</div><div class="route-list">'+
      rows.map(function(r){
        return '<div class="cand '+r[3]+'"><span><b>'+esc(r[0])+'</b> <span class="why">— '+esc(r[1])+'</span></span>'+
               '<span class="v">'+esc(r[2])+'</span></div>';
      }).join('')+
      '</div></div></div>'+
      '<p class="fig-cap">Simple to say, hard to specify: every row is a separate conversation about buffers, holds and cost to serve. A spec that doesn’t name all four comes back in UAT.</p></div>';
  },

  availability: function(){
    var rows = [
      ['Quantity on hand','i',100,'100'],
      ['Promised to open orders','w',30,'−30'],
      ['Held as safety stock','w',10,'−10'],
      ['Available to promise','a',60,'60']
    ];
    return '<div class="fig"><div class="fig-panel"><div class="avail">'+
      rows.map(function(r){
        return '<div class="arow"><span>'+esc(r[0])+'</span>'+
               '<span class="abar '+r[1]+'" style="width:'+r[2]+'%"></span>'+
               '<span class="v">'+esc(r[3])+'</span></div>';
      }).join('')+
      '</div></div><p class="fig-cap">Four different numbers, one word. Most availability disputes are two people naming a different row.</p></div>';
  },

  sync: function(){
    var flows = [
      ['→','Orders and fulfilment'],
      ['←','Item and inventory records'],
      ['→','Shipments and returns'],
      ['←','Financial posting']
    ];
    return '<div class="fig"><div class="fig-panel"><div class="sync">'+
      '<div class="sys"><b>HotWax OMS</b><span>owns the order lifecycle, allocation and fulfilment</span></div>'+
      '<div class="flows">'+flows.map(function(f){
        return '<div class="flow"><span class="dir">'+f[0]+'</span><span>'+esc(f[1])+'</span></div>';
      }).join('')+'</div>'+
      '<div class="sys"><b>NetSuite</b><span>owns the item master, stock record and the books</span></div>'+
      '</div></div>'+
      '<p class="fig-cap">Every arrow is a field-ownership decision. The integrations that fail are the ones where two systems both believe they own the same number.</p></div>';
  },

  trail: function(c){
    var steps = c.figureSteps||[];
    if(!steps.length) return '';
    return '<div class="fig"><ol class="trail">'+
      steps.map(function(s){
        return '<li><b>'+fmt(s.b)+'</b><span>'+fmt(s.t)+'</span></li>';
      }).join('')+'</ol>'+
      (has(c.figureCaption)?'<p class="fig-cap">'+fmt(c.figureCaption)+'</p>':'')+'</div>';
  },

  vitaran: function(){
    return '<div class="fig"><div class="fig-panel"><div class="split">'+
      '<div><span class="lbl">Administrator</span><ul>'+
        '<li>Customers and their individual rates</li><li>Inventory as it moves</li>'+
        '<li>Delivery activity across routes</li><li>Expenses against the operation</li>'+
        '<li>Invoices over WhatsApp</li></ul></div>'+
      '<div><span class="lbl">Delivery worker</span><ul>'+
        '<li>Today’s route, nothing else</li><li>Mark delivered, adjust quantity</li>'+
        '<li>On a phone, standing, in a hurry</li><li>No pricing decisions to make</li></ul></div>'+
      '</div></div><p class="fig-cap">Not one product with permissions — two products. Keeping the line clean was the hardest scope discipline in the project.</p></div>';
  },

  loadramp: function(){
    var rows=[
      ['Thread group, ramped','Store staff signing in over a window, not all at once'],
      ['Think time between steps','A real person reading a screen before tapping'],
      ['Journey, not endpoint','The full picking and packing flow, in the order it is used'],
      ['Response assertions','Catches a fast reply that is actually an error'],
      ['Percentile reporting','The slow tail, which is what the counter experiences'],
      ['Grafana alongside','What the server was doing while the numbers moved']
    ];
    return '<div class="fig"><table class="tbl"><thead><tr><th>Element</th><th>What it represents</th></tr></thead><tbody>'+
      rows.map(function(r){return '<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td></tr>';}).join('')+
      '</tbody></table><p class="fig-cap">A test that hammers one endpoint with no think time produces impressive load and tells you nothing about a store’s afternoon.</p></div>';

/* ---------- sections ---------- */
function topbar(S){
  return '<header class="topbar"><div class="wrap">'+
    '<a class="brand" href="#top">'+esc(S.brand)+'</a><nav class="topnav">'+
    (S.nav||[]).map(function(n){return '<a href="'+esc(n.href)+'">'+esc(n.label)+'</a>';}).join('')+
    '</nav></div></header>';
}

function hero(S){
  var h=S.hero||{};
  var acts=(h.actions||[]).map(function(a){
    var cls='btn'+(a.primary?' primary':'');
    var tail=a.external?'<span class="ext">↗</span>':'';
    if(isTodo(a.href)) return '<span class="'+cls+' dead">'+esc(a.label)+' '+fmt(a.href)+'</span>';
    return '<a class="'+cls+'" href="'+esc(a.href)+'"'+(a.external?' target="_blank" rel="noopener"':'')+'>'+esc(a.label)+tail+'</a>';
  }).join('');

  var stats=(h.stats||[]).filter(function(s){ return !isEmptyAfterFills(String(s.value==null?'':s.value)); }).map(function(s){
    var v=String(s.value==null?'':s.value), m=/^(\d+)(.*)$/.exec(v), attr='';
    if(m) attr=' data-count="'+m[1]+'" data-suffix="'+esc(m[2])+'"';
    return '<div class="stat"><div class="n '+esc(s.tone||'')+'"'+attr+'>'+fmt(s.value)+'</div>'+
           '<div class="d">'+fmt(s.label)+'</div></div>';
  }).join('');

  var photo = has(h.photo)
    ? '<img class="hero-photo reveal" src="'+esc(h.photo)+'" alt="Vidhan Sharma">' : '';

  return '<section class="hero" id="top"><div class="wrap">'+
    '<div class="hero-top'+(photo?'':' no-photo')+'">'+
    '<div class="hero-text">'+
      '<h1 class="reveal">'+fmt(h.headline)+'</h1>'+
      (has(h.intro)?'<p class="intro reveal">'+fmt(h.intro)+'</p>':'')+
      ((h.facts||[]).length?'<ul class="facts reveal">'+h.facts.map(function(f){return '<li>'+fmt(f)+'</li>';}).join('')+'</ul>':'')+
      (acts?'<div class="acts reveal">'+acts+'</div>':'')+
    '</div>'+photo+'</div>'+
    (stats?'<div class="stats reveal">'+stats+'</div>':'')+
    ((h.clients||[]).length?'<div class="clients reveal"><span class="lbl">'+
      esc(h.clientsLabel||'')+'</span><ul>'+
      h.clients.map(function(c){return '<li>'+esc(c)+'</li>';}).join('')+'</ul></div>':'')+
    '</div></section>';
}

function shortBlock(c){
  var tags=(c.tags||[]).filter(function(t){ return !isEmptyAfterFills(t.text); }).map(function(t){
    return '<li class="tag '+esc(t.tone||'')+'">'+fmt(t.text)+'</li>';
  }).join('');
  var link='';
  if(c.link && has(c.link.label)){
    link = isTodo(c.link.label)||!has(c.link.href)
      ? '<p style="margin:0 0 1em">'+fmt(c.link.label)+'</p>'
      : '<p style="margin:0 0 1em"><a href="'+esc(safeHref(c.link.href))+'" target="_blank" rel="noopener">'+esc(c.link.label)+'</a></p>';
  }
  return '<article class="short">'+
    (has(c.logo)?'<img class="short-logo" src="'+esc(c.logo)+'" alt="" loading="lazy">':'')+
    (has(c.eyebrow)?'<span class="lbl">'+esc(c.eyebrow)+'</span>':'')+
    '<h3>'+fmt(c.title)+'</h3>'+
    (has(c.summary)?'<p>'+fmt(c.summary)+'</p>':'')+
    link+
    (tags?'<ul class="tags">'+tags+'</ul>':'')+
    '</article>';
}

function caseBlock(c){
  var pir=(c.cards||[]).map(function(b){
    var k=(b.label||'').toLowerCase();
    var cls = k==='result'?'result' : (k==='problem'?'problem':'');
    return '<div class="box '+cls+'"><span class="lbl">'+esc(b.label)+'</span><p>'+fmt(b.text)+'</p></div>';
  }).join('');

  var tags=(c.tags||[]).filter(function(t){ return !isEmptyAfterFills(t.text); }).map(function(t){
    return '<li class="tag '+esc(t.tone||'')+'">'+fmt(t.text)+'</li>';
  }).join('');

  var fields='';
  if(c.fields){
    var rows=[];
    for(var k in c.fields){ if(has(c.fields[k])) rows.push('<div class="row"><dt class="lbl">'+esc(k)+'</dt><dd>'+fmt(c.fields[k])+'</dd></div>'); }
    if(rows.length) fields='<dl class="fields">'+rows.join('')+'</dl>';
  }

  var fig='';
  if(has(c.figure)  && FIGURES[c.figure])  fig =FIGURES[c.figure](c);
  if(has(c.figure2) && FIGURES[c.figure2]) fig+=FIGURES[c.figure2](c);

  var long='';
  if((c.long||[]).length){
    long='<details class="more"><summary>Read the full case study</summary><div class="more-body">'+
      c.long.map(function(b){
        var out='<h4>'+fmt(b.h)+'</h4>';
        (b.p||[]).forEach(function(p){ if(!isEmptyAfterFills(p)) out+='<p>'+fmt(p)+'</p>'; });
        if((b.steps||[]).length){
          out+='<ol class="trail">'+b.steps.map(function(s){
            return '<li><b>'+fmt(s.b)+'</b><span>'+fmt(s.t)+'</span></li>';}).join('')+'</ol>';
        }
        if((b.list||[]).length){
          out+='<ul>'+b.list.filter(function(i){return !isEmptyAfterFills(i);}).map(function(i){return '<li>'+fmt(i)+'</li>';}).join('')+'</ul>';
        }
        return out;
      }).join('')+
    '</div></details>';
  }

  return '<article class="case">'+
    (has(c.eyebrow)?'<span class="lbl">'+esc(c.eyebrow)+'</span>':'')+
    '<h3>'+fmt(c.title)+'</h3>'+
    (has(c.summary)?'<p class="summary">'+fmt(c.summary)+'</p>':'')+
    fig+
    '<div class="case-grid"><div>'+
      (pir?'<div class="pir">'+pir+'</div>':'')+
      (tags?'<ul class="tags">'+tags+'</ul>':'')+
      long+
    '</div>'+fields+'</div></article>';
}

function work(S){
  var w=S.workIntro||{}, all=S.cases||[];
  var full=all.filter(function(c){return !c.compact;});
  var shorts=all.filter(function(c){return !!c.compact;});
  return '<section id="work"><div class="wrap"><div class="sec-head">'+
    (has(w.eyebrow)?'<span class="lbl">'+esc(w.eyebrow)+'</span>':'')+
    '<h2>'+fmt(w.title)+'</h2></div>'+
    full.map(caseBlock).join('')+
    (shorts.length?'<div class="shorts">'+shorts.map(shortBlock).join('')+'</div>':'')+
    '</div></section>';
}

function about(S){
  var a=S.about||{};
  var groups=(a.skillGroups||[]).map(function(g){
    return '<div class="skill-g"><span class="lbl">'+esc(g.label)+'</span><ul>'+
      (g.items||[]).map(function(i){return '<li class="tag">'+fmt(i)+'</li>';}).join('')+'</ul></div>';
  }).join('');
  return '<section id="about"><div class="wrap"><div class="sec-head">'+
    (has(a.eyebrow)?'<span class="lbl">'+esc(a.eyebrow)+'</span>':'')+
    '<h2>'+fmt(a.title)+'</h2></div>'+
    '<div class="about-grid"><div>'+
      (has(a.photo)?'<img class="about-photo" src="'+esc(a.photo)+'" alt="Vidhan Sharma" loading="lazy">':'')+
      (has(a.opening)?'<p class="about-open">'+fmt(a.opening)+'</p>':'')+
      '<div class="about-body">'+(a.paragraphs||[]).filter(function(p){return !isEmptyAfterFills(p);}).map(function(p){return '<p>'+fmt(p)+'</p>';}).join('')+'</div>'+
    '</div><div>'+groups+'</div></div></div></section>';
}

function contact(S){
  var c=S.contact||{};
  var items=(c.items||[]).map(function(it,i){
    var act='';
    if(it.action==='copy' && !isTodo(it.value)){
      act='<button type="button" data-copy="'+esc(it.value)+'">Copy</button>';
    }else if(it.action==='open' && has(it.href) && !isTodo(it.href)){
      act='<a class="act" href="'+esc(it.href)+'" target="_blank" rel="noopener">Open ↗</a>';
    }
    return '<div class="citem"><span class="lbl">'+esc(it.label)+'</span>'+
      '<div class="val">'+fmt(it.value)+'</div>'+act+'</div>';
  }).join('');
  return '<section id="contact"><div class="wrap"><div class="sec-head">'+
    (has(c.eyebrow)?'<span class="lbl">'+esc(c.eyebrow)+'</span>':'')+
    '<h2>'+fmt(c.title)+'</h2>'+
    (has(c.intro)?'<p class="intro" style="max-width:52ch;color:var(--ink-soft);margin-top:1em">'+fmt(c.intro)+'</p>':'')+
    '</div><div class="clist">'+items+'</div></div></section>';
}

/* ---------- motion ---------- */
function countUp(n){
  var target=parseInt(n.getAttribute('data-count'),10);
  if(isNaN(target)) return;
  var suffix=n.getAttribute('data-suffix')||'', start=null, dur=900;
  function step(ts){
    if(start===null) start=ts;
    var k=Math.min(1,(ts-start)/dur);
    k = 1-Math.pow(1-k,3);                       // ease out
    n.textContent=Math.round(target*k)+suffix;
    if(k<1) requestAnimationFrame(step);
  }
  n.textContent='0'+suffix;
  requestAnimationFrame(step);
}

function motion(){
  var reduce=false;
  try{ reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
  var noIO=!('IntersectionObserver' in window);

  if(reduce||noIO){
    document.querySelectorAll('.reveal,.cand').forEach(function(n){n.classList.add('in');});
    return;
  }
  document.documentElement.classList.add('js');

  /* 1 + 2 — the hero settles, then the numbers run */
  var items=[].slice.call(document.querySelectorAll('.hero .reveal'));
  items.forEach(function(n,i){ n.style.transitionDelay=(i*90)+'ms'; });
  requestAnimationFrame(function(){
    items.forEach(function(n){ n.classList.add('in'); });
  });
  setTimeout(function(){
    document.querySelectorAll('.hero [data-count]').forEach(countUp);
  }, items.length*90+260);

  /* 3 — the routing decision resolves, one candidate at a time */
  var io=new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(!e.isIntersecting) return;
      var cands=e.target.querySelectorAll('.cand');
      cands.forEach(function(c,i){ setTimeout(function(){ c.classList.add('in'); }, i*230); });
      io.unobserve(e.target);
    });
  },{threshold:.4});
  document.querySelectorAll('.route-list').forEach(function(n){ io.observe(n); });
}

/* ---------- boot ---------- */
function fail(msg, detail){
  document.getElementById('app').innerHTML =
    '<div class="err"><h2>content.js has a small error</h2>'+
    '<p>'+msg+'</p>'+
    '<p>Almost always a missing <code>"</code> quote, a missing <code>,</code> comma, or a deleted <code>{ }</code> bracket.</p>'+
    '<p><b>To fix:</b> open the file on github.com, press the History button, and revert your last change. The site comes straight back.</p>'+
    (detail?'<pre>'+esc(detail)+'</pre>':'')+'</div>';
}

try{
  var S = window.SITE;
  if(!S){ fail('The file did not load, so the page has no content to show.',''); return; }
  document.getElementById('app').innerHTML =
    topbar(S)+'<main>'+hero(S)+work(S)+about(S)+contact(S)+'</main>'+
    '<footer><div class="wrap">'+esc((S.meta&&S.meta.footer)||'')+'</div></footer>';

  motion();

  /* copy buttons */
  document.addEventListener('click', function(e){
    var b = e.target.closest && e.target.closest('button[data-copy]');
    if(!b) return;
    var txt=b.getAttribute('data-copy'), old=b.textContent;
    try{
      navigator.clipboard.writeText(txt).then(function(){
        b.textContent='Copied'; setTimeout(function(){b.textContent=old;},1600);
      },function(){ b.textContent='Press Ctrl+C'; setTimeout(function(){b.textContent=old;},2000); });
    }catch(err){ b.textContent='Press Ctrl+C'; setTimeout(function(){b.textContent=old;},2000); }
  });
}catch(err){
  fail('The site could not be built from the file.', err && err.message);
}
})();
