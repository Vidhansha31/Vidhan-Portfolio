<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Vidhan Sharma — Product and customer success, B2B SaaS</title>
<meta name="description" content="Product Associate at HotWax Commerce. Enterprise order management, NetSuite integration, production escalations and peak-season readiness for retail brands.">
<meta property="og:title" content="Vidhan Sharma — Product and customer success, B2B SaaS">
<meta property="og:description" content="Order management, NetSuite integration and production escalations for enterprise retail brands.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="/favicons/favicon.ico">
<script src="content.js"></script>
<script>
/* Theme colours from content.js, applied before paint. */
(function(){try{
  var t=(window.SITE||{}).theme||{}, r=document.documentElement;
  for(var k in t){ r.style.setProperty('--'+k.replace(/[A-Z]/g,function(m){return '-'+m.toLowerCase();}), t[k]); }
  if(window.SITE&&SITE.meta&&SITE.meta.tabTitle) document.title=SITE.meta.tabTitle;
}catch(e){}})();
</script>
<style>
/* ======================================================================
   TOKENS — defaults. content.js → theme overrides any of these.
   ====================================================================== */
:root{
  color-scheme:only light;
  --bg:#FAF9F6; --surface:#FFFFFF; --ink:#23332A; --muted:#5F6E65; --line:#E7E4DC;
  --accent:#4E7A5F; --sage:#7A9E87; --accent-soft:#EAF1EB; --blush:#E8B4A8; --blush-soft:#F9E9E4;
  --good:#3F7055; --good-soft:#E6F0E8; --warn:#A8553F; --warn-soft:#F8E4DE; --loss:#D9907E;
  --display:"Newsreader", Georgia, "Times New Roman", serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased}
img{max-width:100%}
.wrap{max-width:1080px;margin:0 auto}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
h1,h2,h3{font-family:var(--display);font-weight:500;text-wrap:balance;line-height:1.15;margin:0;letter-spacing:-.015em}
p{margin:0}
.label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.prose{max-width:66ch}
.fill{color:var(--warn);border-bottom:1.5px dashed var(--warn);font-style:normal}

/* ---------------------------------------------------------------- nav */
nav{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)))}
nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav .name{font-family:var(--display);font-weight:600;font-size:20px;color:var(--ink);text-decoration:none}
nav ul{display:flex;gap:20px;list-style:none;margin:0;padding:0;font-size:14px}
nav ul a{color:var(--muted);text-decoration:none}
nav ul a:hover{color:var(--ink)}
@media (max-width:720px){nav ul{display:none}}

/* ---------------------------------------------------------------- hero */
.hero{display:grid;grid-template-columns:1fr auto;gap:48px;align-items:center;padding-block:72px 48px}
.hero h1{font-size:clamp(36px,5.8vw,60px);font-weight:500;line-height:1.08;margin-top:14px}
.hero h1 em{font-style:italic;color:var(--accent);
  background:linear-gradient(transparent 68%,var(--blush-soft) 68%,var(--blush-soft) 92%,transparent 92%)}
.hero .lede{margin-top:20px;font-size:18px;color:var(--muted);max-width:58ch}
.hero .lede a{color:var(--muted);text-decoration-color:var(--line);text-underline-offset:3px}
.hero .lede a:hover{color:var(--accent)}
.hero .meta{margin-top:24px;display:flex;flex-wrap:wrap;gap:8px 20px;font-size:14px;color:var(--muted)}
.hero .meta span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--blush);margin-right:8px;vertical-align:middle}
.actions{margin-top:28px;display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:8px;font:500 15px var(--body);
  text-decoration:none;border:1px solid var(--line);color:var(--ink);background:var(--surface);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#FFFFFF}
.btn:hover{border-color:var(--sage)}
.btn.primary:hover{background:#43694F}
.photo{display:block;width:310px;height:auto;aspect-ratio:4/5;max-width:100%;object-fit:cover;object-position:center top;
  border-radius:12px;background:var(--blush-soft);border:0;
  box-shadow:14px 14px 0 var(--blush-soft),0 18px 36px -22px rgba(35,51,42,.4)}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr);gap:28px;padding-block:40px 32px}.photo{width:180px;order:-1}}

/* ---------------------------------------------------------------- impact */
.impact{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.impact div{padding:22px 22px;border-right:1px solid var(--line)}
.impact div:last-child{border-right:0}
.impact b{display:block;font-family:var(--display);font-weight:500;font-size:38px;color:var(--accent);line-height:1.1;font-variant-numeric:tabular-nums}
.impact span{display:block;margin-top:6px;font-size:14px;color:var(--muted);line-height:1.4}
@media (max-width:760px){.impact{grid-template-columns:1fr 1fr}.impact div:nth-child(2){border-right:0}.impact div:nth-child(-n+2){border-bottom:1px solid var(--line)}}

.clients{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 22px;margin-top:18px}
.clients .label{margin-right:4px}
.clients span.c{font-family:var(--display);font-weight:500;font-size:19px;color:var(--ink)}

/* ---------------------------------------------------------------- sections */
section{padding-block:72px 8px}
.sec-head{display:flex;flex-direction:column;gap:8px;margin-bottom:28px}
.sec-head h2{font-size:clamp(26px,3.4vw,34px)}

/* ---------------------------------------------------------------- problem cards */
.index{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.index a{display:flex;flex-direction:column;gap:10px;padding:0 20px 20px;overflow:hidden;border:1px solid var(--line);
  border-radius:12px;background:var(--surface);text-decoration:none;color:var(--ink);transition:border-color .15s}
.index a:hover{border-color:var(--sage);box-shadow:0 10px 24px -18px rgba(35,51,42,.45)}
.index h3{font-size:19px}
.index p{font-size:14px;color:var(--muted);line-height:1.5}
.index .big{font-family:var(--display);font-weight:500;font-size:26px;color:var(--good);font-variant-numeric:tabular-nums;margin-top:auto}
.index .thumb{display:block;width:calc(100% + 40px);max-width:none;margin:0 -20px 6px;aspect-ratio:2/1;height:auto;
  border-bottom:1px solid var(--line);background:var(--accent-soft);transition:transform .35s ease}
.index a:hover .thumb{transform:scale(1.03)}
@media (max-width:860px){.index{grid-template-columns:minmax(0,1fr)}}

/* ---------------------------------------------------------------- case study */
.case{border-top:1px solid var(--line);padding-block:56px 16px}
.case-top{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:40px;align-items:start}
.case-top h2{font-size:clamp(28px,4vw,40px);margin-top:10px}
.glance{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:20px;display:flex;flex-direction:column;gap:14px;font-size:14px}
.glance dl{margin:0;display:grid;gap:12px}
.glance dt{font:12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.glance dd{margin:2px 0 0}
@media (max-width:860px){.case-top{grid-template-columns:minmax(0,1fr);gap:24px}}

.pir{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:20px}
.pir-item{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--line);border-radius:12px;
  padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.pir-item p{font-size:15px;line-height:1.5;color:var(--ink)}
.pir-k{font:500 11.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pir-item.is-p{border-top-color:var(--blush)}
.pir-item.is-i{border-top-color:#B9CDBF}
.pir-item.is-r{border-top-color:var(--sage);background:var(--accent-soft)}
.pir-item.is-r .pir-k{color:var(--accent)}
@media (max-width:700px){.pir{grid-template-columns:minmax(0,1fr)}}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.chip{display:inline-flex;align-items:baseline;gap:6px;padding:6px 12px;border-radius:999px;background:var(--good-soft);color:var(--good);font-size:14px;font-weight:500}
.chip b{font-family:var(--display);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}

/* the big-number opener */
.hook{margin-top:28px;display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:28px;align-items:center;
  padding:24px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.hook-num b{display:block;font-family:var(--display);font-weight:500;font-size:clamp(52px,7vw,72px);line-height:1;color:var(--warn);letter-spacing:-.02em}
.hook-num b.good{color:var(--good)}
.hook-num span{display:block;margin-top:8px;font-size:15px;color:var(--muted);line-height:1.45}
.hook-title{font-size:14px;font-weight:600;margin-bottom:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;background:var(--sage)}
.legend i.lost{background:var(--loss)} .legend i.base{background:#DAD6CC}
@media (max-width:700px){.hook{grid-template-columns:minmax(0,1fr);gap:18px;padding:18px}}

/* bars */
.funnel{display:grid;gap:10px}
.frow{display:grid;grid-template-columns:170px minmax(0,1fr) 56px;gap:12px;align-items:center;font-size:14px}
.bar{height:22px;border-radius:4px;overflow:hidden;display:flex;gap:2px}
.bar i{display:block;height:100%;background:var(--sage);border-radius:0 4px 4px 0;flex:none}
.bar i + i{border-radius:2px 4px 4px 2px}
.bar i.lost{background:var(--loss)} .bar i.base{background:#DAD6CC}
.frow .v{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:480px){.frow{grid-template-columns:110px minmax(0,1fr) 48px;font-size:13px}}

/* routing + sync + timeline diagrams */
.route{display:grid;gap:7px}
.cand{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-size:14px}
.cand b{font-weight:600}
.cand .why{color:var(--muted)}
.r-tag{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;
  background:var(--bg);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.cand.win{border-color:var(--good)} .cand.win .r-tag{background:var(--good-soft);color:var(--good);border-color:transparent}
.cand.no .r-tag{background:var(--warn-soft);color:var(--warn);border-color:transparent}

.sync{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch;margin-top:6px}
.sys{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px 16px}
.sys b{display:block;font-family:var(--display);font-size:17px;font-weight:600}
.sys span{font-size:14px;color:var(--muted)}
.flows{display:grid;gap:6px;align-content:center}
.flow{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);white-space:nowrap}
.flow i{font-style:normal;color:var(--sage);font-weight:700}
@media (max-width:700px){.sync{grid-template-columns:minmax(0,1fr)}.flow{white-space:normal}}

.tl{position:relative;list-style:none;margin:6px 0 0;padding:0 0 0 28px;display:grid;gap:0}
.tl::before{content:"";position:absolute;left:8px;top:10px;bottom:10px;width:2px;background:var(--line)}
.tl li{position:relative;padding:7px 0;font-size:14.5px}
.tl li::before{content:"";position:absolute;left:-28px;top:12px;width:18px;height:18px;border-radius:50%;
  background:var(--surface);border:2px solid var(--line);transition:background-color .35s,border-color .35s}
.tl li.lit::before{background:var(--sage);border-color:var(--sage)}
.tl li b{font-weight:600}
.tl li span{color:var(--muted)}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:460px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--bg)}

/* expanded case study */
.more{margin-top:24px}
.more > summary{list-style:none;display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border:1px solid var(--line);
  border-radius:999px;background:var(--surface);font:600 15px var(--body);color:var(--accent);cursor:pointer;transition:border-color .15s,background .15s}
.more > summary::-webkit-details-marker{display:none}
.more > summary:hover{border-color:var(--sage);background:var(--accent-soft)}
.more > summary svg{transition:transform .2s}
.more[open] > summary svg{transform:rotate(180deg)}
.more .more-close{display:none}
.more[open] .more-open{display:none}
.more[open] .more-close{display:inline}
.more[open] > summary{margin-bottom:8px}
.step{display:grid;grid-template-columns:160px minmax(0,1fr);gap:32px;padding-block:28px;border-bottom:1px dashed var(--line)}
.step:last-of-type{border-bottom:0}
.step > .label{padding-top:4px}
.step h3{font-size:21px;margin-bottom:10px}
.step .prose > * + *{margin-top:12px}
.step ul{margin:0;padding-left:20px}
.step li + li{margin-top:6px}
@media (max-width:760px){.step{grid-template-columns:minmax(0,1fr);gap:8px}}
.quote{border-left:3px solid var(--blush);padding:4px 0 4px 18px;color:var(--ink);font-family:var(--display);font-style:italic;font-size:21px;line-height:1.4}

/* ---------------------------------------------------------------- product thinking */
.pt-logo{width:120px;height:120px;object-fit:contain;margin:0 0 -6px -10px}
.drive-link{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:9px 16px;border-radius:999px;
  background:var(--blush-soft);color:var(--ink);font:600 14.5px var(--body);text-decoration:none;border:1px solid transparent;transition:border-color .15s}
.drive-link:hover{border-color:var(--blush)}
.pod{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:36px;align-items:start;margin-top:16px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.split > div{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:16px}
.split .label{display:block;margin-bottom:8px;color:var(--accent)}
.split ul{margin:0;padding-left:18px;font-size:14px;color:var(--muted)}
.split li + li{margin-top:4px}
.pod figcaption{font-size:13px;color:var(--muted);margin-top:8px}
.pod figure{margin:0}
@media (max-width:860px){.pod{grid-template-columns:minmax(0,1fr)}}

/* ---------------------------------------------------------------- about */
.about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:48px}
.about .prose p + p{margin-top:16px}
.about .prose p:first-child{font-size:24px;font-family:var(--display);font-style:italic;line-height:1.4}
.about .prose a{color:inherit}
.skills{display:grid;gap:18px;font-size:14px}
.skills ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.skills li{padding:4px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
@media (max-width:860px){.about{grid-template-columns:minmax(0,1fr);gap:32px}}

/* ---------------------------------------------------------------- contact */
.contact{margin-block:72px 48px;padding:40px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.contact h2{font-size:clamp(26px,3.6vw,36px)}
.contact > p{margin-top:10px;color:var(--muted);max-width:56ch}
.cgrid{margin-top:28px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:1000px){.cgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.citem{display:flex;flex-direction:column;gap:6px;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-width:0}
.citem .val{font-weight:500;overflow-wrap:anywhere;user-select:all}
.citem button,.citem a.cta{align-self:flex-start;margin-top:4px;font:500 13px var(--body);color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:none}
@media (max-width:760px){.cgrid{grid-template-columns:minmax(0,1fr)}.contact{padding:24px}}
footer{padding-block:24px 48px;color:var(--muted);font-size:13px;text-align:center}

/* ---------------------------------------------------------------- error screen */
.err{max-width:620px;margin:14vh auto;padding:28px;border:1px solid var(--warn);border-radius:12px;background:var(--warn-soft)}
.err code{background:rgba(0,0,0,.07);padding:2px 5px;border-radius:3px}
.err pre{white-space:pre-wrap;font-size:12px}

/* ---------------------------------------------------------------- motion
   Quiet, like hers: hero settles once, numbers count up, the routing
   decision and the escalation timeline light up when first seen. */
.rv{opacity:0;transform:translateY(12px);transition:opacity .7s cubic-bezier(.2,.6,.2,1),transform .7s cubic-bezier(.2,.6,.2,1)}
.rv.in{opacity:1;transform:none}
.js .cand{opacity:0;transform:translateX(-6px);transition:opacity .45s,transform .45s}
.js .cand.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.rv,.js .cand{opacity:1;transform:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";
var S=window.SITE;

/* ------------------------------------------------------------- helpers */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function safeHref(u){u=String(u||'').trim();return (/^(https?:\/\/|mailto:|tel:|\/|#)/i).test(u)?u:'#';}
function showFills(){return !(S&&S.showFillIns===false);}
function blank(s){ if(s==null) return true; s=String(s); if(!showFills()) s=s.replace(/\[\[.*?\]\]/g,''); return s.trim()===''; }
function fmt(s){
  if(s==null||s==='') return '';
  return esc(s)
    .replace(/\[\[(.+?)\]\]/g, showFills()?'<span class="fill">$1</span>':'')
    .replace(/\[([^\[\]]+)\]\(([^)\s]+)\)/g,function(_,t,u){return '<a href="'+esc(safeHref(u))+'" target="_blank" rel="noopener">'+t+'</a>';})
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/\*([^*]+)\*/g,'<em>$1</em>');
}
function list(arr,fn){return (arr||[]).filter(function(x){return !(typeof x==='string'&&blank(x));}).map(fn).join('');}
function link(a,cls){
  if(!a||blank(a.href)) return '';
  var ext=/^https?:|\.pdf$/i.test(a.href);
  return '<a class="'+cls+'" href="'+esc(safeHref(a.href))+'"'+(ext?' target="_blank" rel="noopener"':'')+'>'+esc(a.label)+(ext?' ↗':'')+'</a>';
}
var CHEV='<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* ------------------------------------------------------------- card illustrations
   Same visual language as the reference: dotted sage field, white cards,
   one blush badge carrying the result. 560 x 280. */
function dots(id){return '<defs><pattern id="d-'+id+'" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#7A9E87" opacity=".22"/></pattern>'+
  '<marker id="a-'+id+'" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7A9E87"/></marker></defs>'+
  '<rect width="560" height="280" fill="#EAF1EB"/><rect width="560" height="280" fill="url(#d-'+id+')"/>';}
function badge(x,y,w,text){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="28" rx="14" fill="#F9E9E4"/>'+
  '<path d="M'+(x+14)+' '+(y+18)+'l6-8 6 8z" fill="#3F7055"/>'+

/* ------------------------------------------------------------- diagrams inside case studies */
var DIAGRAMS={
  bars:function(d){
    return '<p class="hook-title">'+fmt(d.title)+'</p><div class="funnel">'+
      (d.rows||[]).map(function(r){
        return '<div class="frow"><span>'+fmt(r.label)+'</span><div class="bar">'+
          (r.segs||[]).map(function(s){return '<i class="'+esc(s[1]||'')+'" style="width:'+Number(s[0])+'%"></i>';}).join('')+
          '</div><span class="v">'+esc(r.v)+'</span></div>';
      }).join('')+'</div>'+
      ((d.legend||[]).length?'<div class="legend">'+d.legend.map(function(l){return '<span><i class="'+esc(l[0])+'"></i>'+esc(l[1])+'</span>';}).join('')+'</div>':'');
  },
  routing:function(d){
    return '<p class="hook-title">'+fmt(d.title)+'</p><div class="route">'+
      (d.rows||[]).map(function(r){return '<div class="cand '+esc(r.state||'')+'"><span><b>'+esc(r.name)+'</b> <span class="why">— '+esc(r.why)+'</span></span><span class="r-tag">'+esc(r.tag)+'</span></div>';}).join('')+'</div>';
  },
  timeline:function(d){
    return '<p class="hook-title">'+fmt(d.title)+'</p><ol class="tl">'+
      (d.rows||[]).map(function(r){return '<li><b>'+fmt(r[0])+'</b>'+(r[1]?' <span>— '+fmt(r[1])+'</span>':'')+'</li>';}).join('')+'</ol>';
  },
  table:function(d){
    return (d.title?'<p class="hook-title">'+fmt(d.title)+'</p>':'')+'<div class="tbl"><table><thead><tr>'+
      (d.head||[]).map(function(h){return '<th>'+esc(h)+'</th>';}).join('')+'</tr></thead><tbody>'+
      (d.rows||[]).map(function(r){return '<tr>'+r.map(function(x){return '<td>'+fmt(x)+'</td>';}).join('')+'</tr>';}).join('')+
      '</tbody></table></div>';
  },
  sync:function(d){
    return (d.title?'<p class="hook-title">'+fmt(d.title)+'</p>':'')+'<div class="sync">'+
      '<div class="sys"><b>'+esc(d.left[0])+'</b><span>'+esc(d.left[1])+'</span></div>'+
      '<div class="flows">'+(d.flows||[]).map(function(f){return '<div class="flow"><i>'+(f[0]==='<'?'←':'→')+'</i>'+esc(f[1])+'</div>';}).join('')+'</div>'+
      '<div class="sys"><b>'+esc(d.right[0])+'</b><span>'+esc(d.right[1])+'</span></div></div>';
  },
  split:function(d){
    return '<div class="split">'+(d.cols||[]).map(function(c){return '<div><span class="label">'+esc(c.label)+'</span><ul>'+
      list(c.items,function(i){return '<li>'+fmt(i)+'</li>';})+'</ul></div>';}).join('')+'</div>';
  }
};
function diagram(d){ return (d&&DIAGRAMS[d.type])?DIAGRAMS[d.type](d):''; }

/* ------------------------------------------------------------- sections */
function nav(){
  return '<nav><div class="wrap"><a class="name" href="#top">'+esc(S.name)+'</a><ul>'+
    (S.nav||[]).map(function(n){var ext=/^https?:|\.pdf$/i.test(n.href);
      return '<li><a href="'+esc(safeHref(n.href))+'"'+(ext?' target="_blank" rel="noopener"':'')+'>'+esc(n.label)+(ext?' ↗':'')+'</a></li>';}).join('')+
    '</ul></div></nav>';
}

function hero(){
  var h=S.hero||{};
  return '<header class="hero"><div>'+
    (blank(h.label)?'':'<p class="label rv">'+fmt(h.label)+'</p>')+
    '<h1 class="rv">'+fmt(h.headline)+'</h1>'+
    (blank(h.lede)?'':'<p class="lede rv">'+fmt(h.lede)+'</p>')+
    '<div class="meta rv">'+list(h.facts,function(f){return '<span>'+fmt(f)+'</span>';})+'</div>'+
    '<div class="actions rv">'+(h.actions||[]).map(function(a){return link(a,'btn'+(a.primary?' primary':''));}).join('')+'</div>'+
    '</div>'+
    (blank(h.photo)?'':'<img class="photo rv" src="'+esc(h.photo)+'" alt="Portrait of '+esc(S.name)+'" width="560" height="700">')+
    '</header>';
}

function impact(){
  var im=(S.impact||[]).filter(function(x){return !blank(x.value);});
  var cl=S.clients||{};
  return '<div id="work">'+
    (im.length?'<div class="impact" role="list">'+im.map(function(x){
      var m=/^([^\d]*)(\d+)(.*)$/.exec(String(x.value));
      return '<div role="listitem"><b'+(m?' data-pre="'+esc(m[1])+'" data-n="'+m[2]+'" data-post="'+esc(m[3])+'"':'')+'>'+esc(x.value)+'</b><span>'+fmt(x.label)+'</span></div>';
    }).join('')+'</div>':'')+
    ((cl.names||[]).length?'<div class="clients"><span class="label">'+esc(cl.label||'')+'</span>'+
      cl.names.map(function(n){return '<span class="c">'+esc(n)+'</span>';}).join('')+'</div>':'')+
  '</div>';
}

    '<div class="index">'+(S.cases||[]).map(function(c){

        '<p>'+fmt(c.cardText)+'</p>'+(blank(c.cardBig)?'':'<span class="big">'+fmt(c.cardBig)+'</span>')+'</a>';
    }).join('')+'</div></section>';

function caseStudy(c){
  var p=c.pir||{};
  var pir='<div class="pir">'+
    (blank(p.problem)?'':'<div class="pir-item is-p"><span class="pir-k">Problem</span><p>'+fmt(p.problem)+'</p></div>')+
    (blank(p.insight)?'':'<div class="pir-item is-i"><span class="pir-k">Insight</span><p>'+fmt(p.insight)+'</p></div>')+
    (blank(p.result)?'':'<div class="pir-item is-r"><span class="pir-k">Result</span><p>'+fmt(p.result)+'</p></div>')+'</div>';
  var chips=(c.chips||[]).filter(function(x){return !blank(x.t)||!blank(x.b);}).map(function(x){
    return '<span class="chip">'+(blank(x.b)?'':'<b>'+fmt(x.b)+'</b> ')+fmt(x.t)+'</span>';}).join('');
  var gl=[]; for(var k in (c.glance||{})){ if(!blank(c.glance[k])) gl.push('<div><dt>'+esc(k)+'</dt><dd>'+fmt(c.glance[k])+'</dd></div>'); }
  var hk=c.hook||{};
  var hook=(hk.diagram||!blank(hk.num))?'<div class="hook">'+
    '<div class="hook-num"><b class="'+esc(hk.tone||'')+'">'+fmt(hk.num)+'</b><span>'+fmt(hk.text)+'</span></div>'+
    '<div class="hook-chart">'+diagram(hk.diagram)+'</div></div>':'';
  var steps=(c.steps||[]).map(function(s){
    var body='';
    if(!blank(s.h)) body+='<h3>'+fmt(s.h)+'</h3>';
    (s.p||[]).forEach(function(x){ if(!blank(x)) body+='<p>'+fmt(x)+'</p>'; });
    if((s.list||[]).length) body+='<ul>'+list(s.list,function(i){return '<li>'+fmt(i)+'</li>';})+'</ul>';
    if(s.diagram) body+='<div>'+diagram(s.diagram)+'</div>';
    if(!blank(s.quote)) body+='<p class="quote">'+fmt(s.quote)+'</p>';
    (s.after||[]).forEach(function(x){ if(!blank(x)) body+='<p>'+fmt(x)+'</p>'; });
    return '<div class="step"><p class="label">'+esc(s.label)+'</p><div class="prose">'+body+'</div></div>';
  }).join('');
  return '<article class="case" id="'+esc(c.id)+'"><div class="case-top"><div>'+
      '<p class="label">'+fmt(c.label)+'</p><h2>'+fmt(c.title)+'</h2>'+pir+
      (chips?'<div class="chips">'+chips+'</div>':'')+
    '</div>'+(gl.length?'<aside class="glance"><dl>'+gl.join('')+'</dl></aside>':'')+'</div>'+
    hook+
    (steps?'<details class="more"><summary><span class="more-open">Read the full case study</span><span class="more-close">Hide details</span>'+CHEV+'</summary>'+steps+'</details>':'')+
  '</article>';
}

function product(){

    (b.p||[]).forEach(function(x){ if(!blank(x)) out+='<p>'+fmt(x)+'</p>'; });
    if((b.list||[]).length) out+='<ul style="margin:0;padding-left:20px">'+list(b.list,function(i){return '<li>'+fmt(i)+'</li>';})+'</ul>';
    return '<div>'+out+'</div>';
  }).join('');
  return '<section id="'+esc(p.id)+'"><div class="sec-head">'+
    (blank(p.logo)?'':'<img class="pt-logo" src="'+esc(p.logo)+'" alt="'+esc(p.logoAlt||'')+'">')+
    '<p class="label">'+fmt(p.label)+'</p><h2>'+fmt(p.title)+'</h2>'+
    (blank(p.summary)?'':'<p class="prose" style="color:var(--muted);font-size:17px;margin-top:6px">'+fmt(p.summary)+'</p>')+
    (p.link&&!blank(p.link.href)?'<a class="drive-link" href="'+esc(safeHref(p.link.href))+'" target="_blank" rel="noopener">'+esc(p.link.label)+'</a>':'')+
    '</div>'+
    '<details class="more" style="margin-top:0"><summary><span class="more-open">'+esc(p.moreLabel||'See the highlights')+'</span><span class="more-close">Hide details</span>'+CHEV+'</summary>'+
    '<div class="pod"><div class="prose" style="display:grid;gap:22px">'+blocks+'</div>'+
    (p.figure?'<figure>'+diagram(p.figure)+(blank(p.figure.caption)?'':'<figcaption>'+fmt(p.figure.caption)+'</figcaption>')+'</figure>':'')+
    '</div></details></section>';
}

function about(){
  var a=S.about||{};

    '<div class="about"><div class="prose">'+list(a.paragraphs,function(x){return '<p>'+fmt(x)+'</p>';})+'</div>'+
    '<div class="skills">'+(a.skills||[]).map(function(g){return '<div><p class="label">'+esc(g.label)+'</p><ul>'+

function contact(){
  var c=S.contact||{};
  return '<section class="contact" id="contact"><h2>'+fmt(c.title)+'</h2>'+(blank(c.intro)?'':'<p>'+fmt(c.intro)+'</p>')+
    '<div class="cgrid">'+(c.items||[]).map(function(it){
      var act='';
      if(it.copy) act='<button type="button" data-copy="'+esc(it.copyValue||it.value)+'">'+esc(it.cta)+'</button>';
      else if(!blank(it.href)) act='<a class="cta" href="'+esc(safeHref(it.href))+'" target="_blank" rel="noopener">'+esc(it.cta)+'</a>';
      return '<div class="citem"><span class="label">'+esc(it.label)+'</span><span class="val">'+fmt(it.value)+'</span>'+act+'</div>';
    }).join('')+'</div></section>';
}

/* ------------------------------------------------------------- motion */
function motion(){
  var reduce=false; try{reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
  var rv=[].slice.call(document.querySelectorAll('.hero .rv'));
  if(reduce||!('IntersectionObserver' in window)){
    rv.forEach(function(n){n.classList.add('in');});
    document.querySelectorAll('.tl li').forEach(function(n){n.classList.add('lit');});
    return;
  }
  document.documentElement.classList.add('js');
  rv.forEach(function(n,i){n.style.transitionDelay=(i*90)+'ms';});
  requestAnimationFrame(function(){requestAnimationFrame(function(){rv.forEach(function(n){n.classList.add('in');});});});
  var io=new IntersectionObserver(function(es){es.forEach(function(e){
    if(!e.isIntersecting) return; var t=e.target; io.unobserve(t);
    if(t.classList.contains('impact')){
      t.querySelectorAll('b[data-n]').forEach(function(b,i){
        var n=+b.dataset.n, pre=b.dataset.pre||'', post=b.dataset.post||'', st=null;
        setTimeout(function(){requestAnimationFrame(function step(ts){
          if(st===null) st=ts; var k=Math.min(1,(ts-st)/900); k=1-Math.pow(1-k,3);
          b.textContent=pre+Math.round(n*k)+post; if(k<1) requestAnimationFrame(step);});},i*120);
      });
    } else if(t.classList.contains('route')){
      t.querySelectorAll('.cand').forEach(function(c,i){setTimeout(function(){c.classList.add('in');},i*200);});
    } else if(t.classList.contains('tl')){
      t.querySelectorAll('li').forEach(function(l,i){setTimeout(function(){l.classList.add('lit');},i*160);});
    }
  });},{threshold:.35});
  document.querySelectorAll('.impact,.route,.tl').forEach(function(n){io.observe(n);});
}

/* ------------------------------------------------------------- boot */
function fail(msg,detail){
  document.getElementById('app').innerHTML='<div class="err"><h2>content.js has a small error</h2><p>'+msg+'</p>'+
    '<p>Almost always a missing <code>"</code>, a missing <code>,</code> or a deleted bracket. Open the file on github.com, press History, and revert your last change.</p>'+
    (detail?'<pre>'+esc(detail)+'</pre>':'')+'</div>';
}
try{
  if(!S){ fail('The file did not load.'); return; }
  document.getElementById('app').innerHTML=nav()+'<main class="wrap" id="top">'+hero()+impact()+work()+
    (S.cases||[]).map(caseStudy).join('')+product()+about()+contact()+'</main>'+
    '<footer>'+esc((S.meta||{}).footer||'')+'</footer>';
  motion();
  document.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('button[data-copy]'); if(!b) return;
    var old=b.textContent;
    try{navigator.clipboard.writeText(b.getAttribute('data-copy')).then(function(){b.textContent='Copied';setTimeout(function(){b.textContent=old;},1500);});}
    catch(err){b.textContent='Press Ctrl+C';setTimeout(function(){b.textContent=old;},1800);}
  });
}catch(err){ fail('The site could not be built from the file.', err&&err.message); }
})();
