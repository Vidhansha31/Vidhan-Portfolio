# Plain HTML site. Nothing to build, nothing to install.
[build]
  # An explicit command here overrides whatever is set in the Netlify UI.
  command = "echo 'static site - no build step'"
  publish = "."

# Old Next.js URLs land on the single page instead of showing 404.
[[redirects]]
  from = "/posts/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/projects/*"
  to = "/"
  status = 301
